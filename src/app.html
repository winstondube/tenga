*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}

p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}

svg{display:block}
.num{font-variant-numeric:tabular-nums}

/* ---------- primitives ---------- */
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.tiny{font-size:12px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spread{display:flex;gap:12px;align-items:center;justify-content:space-between}
.col{display:flex;flex-direction:column}
.stack{display:flex;flex-direction:column;gap:14px}
.stack-s{display:flex;flex-direction:column;gap:8px}
.stack-l{display:flex;flex-direction:column;gap:26px}
.grow{flex:1;min-width:0}
.hr{height:1px;background:var(--line);border:0;margin:0}
.center{text-align:center}
.nowrap{white-space:nowrap}

.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);cursor:pointer;font-size:14px;font-weight:520;transition:background .13s,border-color .13s,transform .06s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(.5px)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent-ink);border-color:var(--accent-ink);color:var(--on-accent)}
.btn-danger{color:var(--danger);border-color:var(--danger)}
.btn-danger:hover{background:var(--danger-soft)}
.btn-s{padding:5px 10px;font-size:13px}
.btn-xs{padding:3px 8px;font-size:12px}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ghost:hover{background:var(--surface-2)}
.btn-block{width:100%;justify-content:center}
.btn-lg{padding:12px 20px;font-size:15.5px}

label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:560;color:var(--ink-2)}
label.f > .hint{font-weight:400;color:var(--ink-3);font-size:12px}
input[type=text],input[type=email],input[type=tel],input[type=url],input[type=number],input[type=date],select,textarea{
  width:100%;padding:8px 10px;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);font-size:14px;font-weight:400;color:var(--ink)}
textarea{resize:vertical;min-height:64px;font-family:var(--sans)}
input:disabled,select:disabled{background:var(--surface-2);color:var(--ink-3)}
.field-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.field-grid.two{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.check{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;color:var(--ink-2);cursor:pointer}
.check input{margin-top:3px;accent-color:var(--accent);flex:none}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.card-p{padding:18px}
.card-h{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
.card-b{padding:16px}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:100px;font-size:11.5px;font-weight:600;font-family:var(--mono);letter-spacing:.02em;white-space:nowrap;border:1px solid transparent}
.p-accent{background:var(--accent-soft);color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent) 24%,transparent)}
.p-ochre{background:var(--ochre-soft);color:var(--ochre-ink);border-color:color-mix(in srgb,var(--ochre) 26%,transparent)}
.p-danger{background:var(--danger-soft);color:var(--danger);border-color:color-mix(in srgb,var(--danger) 26%,transparent)}
.p-warn{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 26%,transparent)}
.p-info{background:var(--info-soft);color:var(--info);border-color:color-mix(in srgb,var(--info) 26%,transparent)}
.p-mute{background:var(--surface-2);color:var(--ink-3);border-color:var(--line)}

.note{padding:11px 13px;border-radius:var(--r);font-size:13.5px;display:flex;gap:9px;align-items:flex-start;line-height:1.5}
.note svg{flex:none;margin-top:2px}
.n-accent{background:var(--accent-soft);color:var(--accent-ink)}
.n-warn{background:var(--warn-soft);color:var(--warn)}
.n-danger{background:var(--danger-soft);color:var(--danger)}
.n-info{background:var(--info-soft);color:var(--info)}
.n-mute{background:var(--surface-2);color:var(--ink-2)}

table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr.clickable{cursor:pointer}
table.t tbody tr.clickable:hover{background:var(--surface-2)}
.scroll-x{overflow-x:auto}

.thumb{width:46px;height:46px;flex:none;border-radius:3px;display:grid;place-items:center;font-family:var(--mono);font-size:13px;font-weight:700;color:#fff;letter-spacing:.02em;border:1px solid rgba(0,0,0,.08)}
.thumb.lg{width:72px;height:72px;font-size:18px}

/* ---------- shell ---------- */
.topbar{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1400px;margin:0 auto;padding:9px 20px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-weight:700;font-size:14px;letter-spacing:-.02em;text-decoration:none}
.brand .mark{width:22px;height:22px;border-radius:3px;background:var(--accent);display:grid;place-items:center;color:var(--on-accent)}
.brand .tld{color:var(--ochre)}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:2px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink-3);font-family:var(--mono);letter-spacing:.03em}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}

.wrap{max-width:1400px;margin:0 auto;padding:22px 20px 80px}
.narrow{max-width:800px;margin:0 auto;padding:28px 20px 80px}
.narrow-s{max-width:620px;margin:0 auto;padding:28px 20px 80px}

/* ---------- admin shell ---------- */
.admin{display:grid;grid-template-columns:232px minmax(0,1fr);gap:22px;align-items:start}
.rail{position:sticky;top:60px;display:flex;flex-direction:column;gap:18px}

.rail-grp > .eyebrow{padding:0 8px 6px}
.rail a{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:3px;text-decoration:none;font-size:13.5px;color:var(--ink-2)}
.rail a:hover{background:var(--surface-2)}
.rail a.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:inset 2px 0 0 var(--accent)}
.rail a .cnt{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-3);background:var(--surface-2);padding:0 6px;border-radius:100px;min-width:20px;text-align:center}
.rail a.on .cnt{background:var(--accent-soft);color:var(--accent-ink)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}

.kpi.stripe-d{box-shadow:inset 0 -2px 0 var(--danger)}
.kpi.stripe-o{box-shadow:inset 0 -2px 0 var(--ochre)}
.kpi.stripe-w{box-shadow:inset 0 -2px 0 var(--warn)}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;margin-bottom:0}
.tabs button{border:0;background:transparent;padding:9px 13px;cursor:pointer;font-size:13.5px;font-weight:560;color:var(--ink-3);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--danger);margin-left:5px;vertical-align:middle}

/* ---------- timeline ---------- */
.tl{display:flex;flex-direction:column;gap:0;position:relative}
.tl-row{display:grid;grid-template-columns:22px 1fr;gap:12px;padding-bottom:16px;position:relative}
.tl-row:last-child{padding-bottom:0}
.tl-row::before{content:"";position:absolute;left:10px;top:18px;bottom:0;width:1px;background:var(--line-2)}
.tl-row:last-child::before{display:none}
.tl-dot{width:21px;height:21px;border-radius:50%;border:1px solid var(--line-2);background:var(--surface);display:grid;place-items:center;z-index:1}
.tl-row.done .tl-dot{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tl-row.done.zw .tl-dot{background:var(--ochre);border-color:var(--ochre)}
.tl-row.now .tl-dot{border-color:var(--accent);border-width:2px;background:var(--surface)}
.tl-row.now.zw .tl-dot{border-color:var(--ochre)}
.tl-row.done::before{background:var(--accent)}
.tl-row.done.zw::before{background:var(--ochre)}
.tl-t{font-weight:600;font-size:14px}
.tl-row.todo .tl-t{color:var(--ink-3);font-weight:500}

.item-card{border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}

.sum{display:flex;flex-direction:column;gap:6px;font-size:14px}
.sum .l{display:flex;justify-content:space-between;gap:16px}

.sum .l .v{font-family:var(--mono);font-variant-numeric:tabular-nums}

.modal-bg{position:fixed;inset:0;background:rgba(10,14,15,.45);z-index:100;display:grid;place-items:center;padding:20px;overflow:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);max-width:520px;width:100%;box-shadow:var(--shadow);margin:auto}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:100px;font-size:13.5px;z-index:200;box-shadow:var(--shadow);animation:tin .2s ease}
@keyframes tin{from{opacity:0;transform:translateX(-50%) translateY(6px)}}

.hero-lede{font-family:var(--serif);font-size:clamp(30px,5.4vw,46px);line-height:1.1;letter-spacing:-.02em;font-weight:400}
.hero-lede em{font-style:italic;color:var(--accent)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.step{background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:6px}
.step .n{font-family:var(--mono);font-size:11px;color:var(--accent);font-weight:700}
.step.zw .n{color:var(--ochre)}

.empty{padding:40px 20px;text-align:center;color:var(--ink-3);font-size:14px}
.link{color:var(--accent);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.foot{border-top:1px solid var(--line);margin-top:50px;padding:20px;text-align:center;font-size:12.5px;color:var(--ink-3)}
.foot a{color:var(--ink-2)}

.banner{background:var(--ink);color:var(--paper);font-size:12.5px;padding:6px 20px;text-align:center;font-family:var(--mono);letter-spacing:.02em}
.banner b{color:var(--ochre)}

@media (max-width:880px){
  .admin{grid-template-columns:1fr}
  .rail{position:static;flex-direction:row;overflow-x:auto;gap:14px;padding-bottom:8px;border-bottom:1px solid var(--line)}
  .rail-grp{flex-direction:row;gap:2px;flex:none}
  .rail-grp > .eyebrow{display:none}
  .rail a{white-space:nowrap}
  .topbar-in{flex-wrap:wrap;gap:10px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const STOP=new Set(['p','dp','product','products','shop','uk','en','gb','item','ref','sku','html','buy','detail','details','pd','prd','g','a','c','b']);
function titleCase(s){return s.replace(/\b[a-z]/g,c=>c.toUpperCase())}
function extract(url){
 const out={ok:false,url:url,retailerId:null,retailerName:'',name:'',price:null,wasPrice:null,size:'',variant:'',availability:'Unknown',reason:''};
 let u;
 try{u=new URL(url.trim().match(/^https?:\/\//i)?url.trim():'https://'+url.trim())}catch(e){out.reason='That does not look like a web address.';return out}
 const host=u.hostname.replace(/^www\./,'').toLowerCase();
 const r=S.retailers.find(x=>x.domains.some(d=>host===d||host.endsWith('.'+d)));
 out.host=host;
 if(!r){out.reason='unapproved';out.retailerName=titleCase(host.split('.')[0]);return out}
 out.retailerId=r.id;out.retailerName=r.name;
 if(r.status==='disabled'){out.reason='disabled';return out}
 const segs=u.pathname.split('/').filter(Boolean).map(s=>decodeURIComponent(s));
 let slug=segs.filter(s=>!STOP.has(s.toLowerCase())&&!/^\d+$/.test(s)).pop()||'';
 slug=slug.replace(/\.(html?|aspx|php)$/i,'').replace(/[-_+]/g,' ').replace(/\b\d{4,}\b/g,'').replace(/\s+/g,' ').trim();
 if(!slug||slug.length<3){out.reason='noname';out.ok=true;out.name='';}
 else {out.ok=true;out.name=titleCase(slug)}
 if(!r.autoExtract){out.reason='noauto';out.price=null;out.availability='Needs manual check';return out}
 const h=hash(host+u.pathname);
 const base=6+(h%56);const pence=[0.99,0.5,0.95,0.0,0.49][h%5];
 out.price=round2(base+pence);
 if(h%3===0){out.wasPrice=round2(out.price*(1.15+(h%9)/40))}
 const sizes=['50ml','100ml','200ml','250ml','400ml','30ml','75ml','1 pack','2 pack'];
 out.size=sizes[h%sizes.length];
 out.availability=(h%11===0)?'Low stock':'In stock';
 return out;
}

/* ---------------- pricing ---------------- */
function itemPrice(it){const p=(it.confirmedPrice!=null&&it.confirmedPrice!=='')?Number(it.confirmedPrice):Number(it.displayedPrice||0);return round2(p)}
function itemLine(it){return round2(itemPrice(it)*(Number(it.qty)||1))}
function activeItems(o){return o.items.filter(i=>i.itemStatus!=='Removed'&&i.itemStatus!=='Refunded')}
function quoteCalc(o){
 const st=S.settings, items=activeItems(o);
 const groups={};
 items.forEach(it=>{const k=it.retailerId||('other:'+(it.retailerName||'Unknown'));
   if(!groups[k])groups[k]={key:k,retailerId:it.retailerId,name:it.retailerName||'Unknown retailer',items:[],subtotal:0,delivery:0,freeApplied:false};
   groups[k].items.push(it);groups[k].subtotal=round2(groups[k].subtotal+itemLine(it));});
 const list=Object.values(groups);
 list.forEach(g=>{
   const r=g.retailerId?retailerById(g.retailerId):null;
   const override=o.quote&&o.quote.deliveryOverrides?o.quote.deliveryOverrides[g.key]:undefined;
   if(override!==undefined&&override!==''&&override!==null){g.delivery=round2(Number(override)||0);g.manual=true;}
   else if(r){ if(r.freeOver&&g.subtotal>=r.freeOver){g.delivery=0;g.freeApplied=true} else g.delivery=round2(r.delivery||0) }
   else g.delivery=0;
 });
 const productTotal=round2(list.reduce((a,g)=>a+g.subtotal,0));
 const deliveryTotal=round2(list.reduce((a,g)=>a+g.delivery,0));
 let fee;
 if(st.feeBasis==='per-retailer'){fee=round2(list.reduce((a,g)=>a+Math.max(g.subtotal*st.procurementPct/100,st.procurementMin),0))}
 else {fee=round2(Math.max(productTotal*st.procurementPct/100,st.procurementMin))}
 const adjustments=(o.quote&&o.quote.adjustments)||[];
 const adjTotal=round2(adjustments.reduce((a,x)=>a+Number(x.delta||0),0));
 const total=round2(productTotal+deliveryTotal+fee+adjTotal);
 return {groups:list,productTotal,deliveryTotal,fee,adjTotal,adjustments,total,meetsMin:productTotal>=st.minSpend,shortfall:round2(Math.max(0,st.minSpend-productTotal))};
}
function cargoCalc(o){
 const st=S.settings, c=o.cargo||{};
 const actual=Number(c.actualWeight)||0;
 const vol=(c.l&&c.w&&c.h)?round2((Number(c.l)*Number(c.w)*Number(c.h))/(st.volDivisor||5000)):(Number(c.volWeight)||0);
 const pack=c.packaging!=null&&c.packaging!==''?Number(c.packaging):(st.packagingKg||0);
 const chargeable=round2(Math.max(actual+pack,vol));
 const rate=c.rate!=null&&c.rate!==''?Number(c.rate):st.cargoRate;
 const freight=round2(Math.max(chargeable*rate,st.cargoMin));
 const clearance=c.clearance!=null&&c.clearance!==''?Number(c.clearance):st.clearance;
 const local=c.localDelivery!=null&&c.localDelivery!==''?Number(c.localDelivery):st.localDelivery;
 const other=Number(c.other)||0;
 const total=round2(freight+clearance+local+other);
 return {actual,vol,pack,chargeable,rate,freight,clearance,local,other,total};
}
function estimateCargo(o){
 const st=S.settings;
 const kg=activeItems(o).reduce((a,i)=>a+(Number(i.estKg)||0.45)*(Number(i.qty)||1),0)+ (st.packagingKg||0);
 const freight=Math.max(kg*st.cargoRate,st.cargoMin);
 return {kg:round2(kg),low:round2(freight+st.clearance),high:round2(freight*1.35+st.clearance+st.localDelivery)};
}
function payTotals(o){
 const paid=o.payments.filter(p=>['Payment completed','Payment available','Payment held'].includes(p.status));
 const initialPaid=paid.filter(p=>p.type!=='cargo').reduce((a,p)=>a+p.amount,0);
 const cargoPaid=paid.filter(p=>p.type==='cargo').reduce((a,p)=>a+p.amount,0);
 const refunded=(o.refunds||[]).reduce((a,r)=>a+Number(r.amount||0),0);
 return {initialPaid:round2(initialPaid),cargoPaid:round2(cargoPaid),refunded:round2(refunded),net:round2(initialPaid+cargoPaid-refunded)};
}
function margin(o){
 const t=payTotals(o);
 const cost=activeItems(o).reduce((a,i)=>a+((i.purchase&&i.purchase.actualCost!=null)?Number(i.purchase.actualCost):itemLine(i)),0);
 const del=activeItems(o).reduce((a,i)=>a+((i.purchase&&i.purchase.actualDelivery!=null)?Number(i.purchase.actualDelivery):0),0);
 const q=quoteCalc(o);
 const ukDel=del||q.deliveryTotal;
 return round2(t.net-cost-ukDel-(o.cargo&&o.cargo.paidOut?Number(o.cargo.paidOut):0));
}
function quoteExpired(o){return !!(o.quote&&o.quote.sentAt&&o.quote.expiresAt&&Date.now()>o.quote.expiresAt&&!payTotals(o).initialPaid)}

/* ================================================================
   ROUTER + SHELL
   ================================================================ */
let VIEW={tab:'request',adminTab:'review',search:'',filter:'all'};
function go(h){location.hash=h}
function route(){
 const raw=location.hash.replace(/^#\/?/,'');
 const [path,qs]=raw.split('?');
 const parts=path.split('/').filter(Boolean);
 const q={};(qs||'').split('&').filter(Boolean).forEach(kv=>{const [k,v]=kv.split('=');q[decodeURIComponent(k)]=decodeURIComponent(v||'')});
 return {parts,q};
}
function render(){
 const {parts,q}=route();
 const isAdmin=parts[0]==='admin';
 let body='';
 try{
  if(!parts.length)body=viewHome();
  else if(parts[0]==='request')body=viewRequest();
  else if(parts[0]==='submitted')body=viewSubmitted(parts[1]);
  else if(parts[0]==='track')body=viewTrack(parts[1],parts[2]);
  else if(parts[0]==='quote')body=viewQuote(parts[1],parts[2]);
  else if(parts[0]==='pay')body=viewPay(parts[1],parts[2],parts[3]);
  else if(parts[0]==='lookup')body=viewLookup();
  else if(isAdmin)body=viewAdmin(parts.slice(1),q);
  else body=`<div class="narrow"><div class="empty">Page not found. <a class="link" href="#/">Go back</a></div></div>`;
 }catch(e){body=`<div class="narrow">${note('<b>Something went wrong rendering this page.</b><br>'+esc(e.message),'danger','alert')}</div>`;console.error(e)}
 $('#app').innerHTML=shell(body,isAdmin);
 window.scrollTo(0,VIEW.keepScroll?window.scrollY:0);VIEW.keepScroll=false;
}
function shell(body,isAdmin){
 return `
 <div class="banner">Prototype build · demo data only · <b>no real payments are taken</b></div>
 <div class="topbar"><div class="topbar-in">
   <a class="brand" href="#/">
     <span class="mark">${icon('plane',14)}</span>
     <span>tenga<span class="tld">.uk</span></span>
   </a>
   <div class="seg" style="margin-left:auto">
     <button data-act="role" data-v="customer" class="${isAdmin?'':'on'}">Customer</button>
     <button data-act="role" data-v="admin" class="${isAdmin?'on':''}">Operations</button>
   </div>
   <button class="btn btn-s btn-ghost" data-act="reset" title="Clear all demo data and start again">${icon('refresh',15)}<span class="tiny">Reset demo</span></button>
 </div></div>
 ${body}
 ${isAdmin?'':`<div class="foot">
   <div style="margin-bottom:6px">Tenga UK, a buy-for-me and forwarding service. Registered in England. Cargo handled by third party carriers.</div>
   <div>Website designed &amp; built by <a href="https://welaunchsites.com/" target="_blank" rel="noopener">LaunchSite</a></div>
 </div>`}`;
}
window.addEventListener('hashchange',render);

 if(p.reason==='badurl')return note(esc(p.msg||'That does not look like a web address.'),'danger','alert');
 if(p.reason==='unapproved')return `<div class="stack-s">
   ${note(`<b>${esc(p.retailerName)} is not currently approved.</b> You can still submit the link for manual review and we will tell you whether we can buy from them.`,'warn','alert')}
   <div class="row wrap"><button class="btn btn-s" data-act="addManual">${icon('plus',15)}Submit for manual review</button><button class="btn btn-s btn-ghost" data-act="clearPending">Cancel</button></div>
 </div>`;
 if(p.reason==='disabled')return note(`<b>We are not buying from ${esc(p.retailerName)} at the moment.</b> Try a different retailer, or contact us if it is important.`,'danger','x');
 return `<div class="card" style="background:var(--surface-2);border-color:var(--line-2)">
  <div class="card-b stack">
   <div class="row" style="align-items:flex-start">
     ${thumb({name:p.name||p.retailerName},true)}
     <div class="grow stack-s">
       <div class="row wrap" style="gap:6px">
         ${pill(p.retailerName,'accent')}
         ${p.availability==='In stock'?pill('In stock','accent'):p.availability==='Low stock'?pill('Low stock','warn'):pill(p.availability,'mute')}
         ${pill('Provisional','mute')}
       </div>
       <input type="text" id="pName" placeholder="Product name" value="${esc(p.name)}" style="font-weight:600">
       ${p.reason==='noauto'?`<div class="tiny" style="color:var(--warn)">This shop blocks automatic reading. Tell us the name and options and we will confirm the price for you.</div>`
        :p.reason==='noname'?`<div class="tiny" style="color:var(--warn)">We could not read a product name from that link. Please type it in.</div>`
        :`<div class="tiny muted">Shown online: <b class="mono">${p.price!=null?money(p.price):'not readable'}</b>${p.wasPrice?` <s class="mono">${money(p.wasPrice)}</s>`:''} · this is not your final price.</div>`}
     </div>
   </div>
   <div class="field-grid">
     <label class="f">Quantity<input type="number" id="pQty" min="1" max="20" value="1"></label>
     <label class="f">Size<input type="text" id="pSize" value="${esc(p.size||'')}" placeholder="e.g. 250ml"></label>
     <label class="f">Colour<input type="text" id="pColour" placeholder="e.g. natural black"></label>
     <label class="f">Shade<input type="text" id="pShade" placeholder="e.g. 4.5N"></label>
     <label class="f">Scent<input type="text" id="pScent" placeholder="e.g. vanilla"></label>
     <label class="f">Other option<input type="text" id="pVariant" placeholder="e.g. 22 inch, UK 8"></label>
   </div>
   <hr class="hr">
   <div class="field-grid two">
     <label class="f">If this exact item is unavailable
       <select id="pSubs">
         <option value="no">Do not substitute, ask me first</option>
         <option value="yes">A close substitute is fine</option>
         <option value="cancel">Cancel this item and refund me</option>
       </select>
     </label>
     <label class="f">What substitutes are acceptable<input type="text" id="pSubsNotes" placeholder="e.g. any CeraVe moisturiser, same size"></label>
   </div>
   <label class="f">Notes for this item<input type="text" id="pNotes" placeholder="Anything specific about this product"></label>
   <div class="row wrap">
     <button class="btn btn-primary btn-s" data-act="addItem">${icon('plus',15)}Add to request</button>
     <button class="btn btn-s btn-ghost" data-act="clearPending">Cancel</button>
   </div>
  </div>
 </div>`;
}

function draftItemCard(it,ix){
 const variantBits=[it.size,it.colour,it.shade,it.scent,it.variant].filter(Boolean).join(' · ');
 return `<div class="item-card"><div class="item-head">
   ${thumb(it)}
   <div class="grow stack-s">
     <div class="row wrap" style="gap:6px">${pill(it.retailerName||'Unknown shop',it.retailerId?'accent':'warn')}${it.restricted.length?pill('Needs review','danger'):''}</div>
     <b style="font-size:14.5px">${esc(it.name||'Unnamed item')}</b>
     ${variantBits?`<div class="tiny muted">${esc(variantBits)}</div>`:''}
     <div class="tiny muted">Qty ${it.qty} · ${it.displayedPrice!=null?`shown at <span class="mono">${money(it.displayedPrice)}</span> each`:'price to be confirmed by us'}</div>
     ${it.subsAllowed==='yes'?`<div class="tiny" style="color:var(--accent)">Substitutes allowed${it.subsNotes?': '+esc(it.subsNotes):''}</div>`:it.subsAllowed==='cancel'?`<div class="tiny muted">Cancel and refund if unavailable</div>`:`<div class="tiny muted">Ask before substituting</div>`}
   </div>
   <div class="col" style="align-items:flex-end;gap:6px">
     <div class="mono" style="font-weight:700">${it.displayedPrice!=null?money(it.displayedPrice*it.qty):'—'}</div>
     <button class="btn btn-xs btn-ghost" data-act="delDraft" data-ix="${ix}" title="Remove">${icon('trash',14)}</button>
   </div>
 </div></div>`;
}

   CUSTOMER: confirmation, tracking, quote, payment

function viewSubmitted(ref){
 const o=getOrder(ref); if(!o)return `<div class="narrow"><div class="empty">We cannot find that request.</div></div>`;
 const st=S.settings;
 return `<div class="narrow"><div class="stack-l">
  <div class="stack-s">
    <div class="row" style="gap:8px;color:var(--accent)">${icon('check',20)}<div class="eyebrow" style="color:var(--accent)">Request received</div></div>
    <h2 style="font-size:26px">We have your request, ${esc(o.customer.name.split(' ')[0]||'there')}.</h2>
    <p style="color:var(--ink-2)">We are checking the current product price, availability and UK delivery cost. You will receive a final quote before any payment. Nothing has been purchased.</p>
  </div>
  <div class="card card-p stack">
    <div class="spread"><span class="eyebrow">Your reference</span>${pill('Within '+st.responseHours+' hours','info')}</div>
    <div class="mono" style="font-size:30px;font-weight:700;letter-spacing:-.02em">${esc(o.ref)}</div>
    <div class="small muted">Save this. You can check progress at any time with your private tracking link.</div>
    <a class="btn btn-primary" href="#/track/${o.ref}/${o.token}">${icon('search',16)}Open my tracking page</a>
  </div>
  <div class="card">
    <div class="card-h"><b>What you asked for</b></div>
    <div class="card-b stack-s">${o.items.map(it=>`<div class="row" style="align-items:flex-start">${thumb(it)}<div class="grow"><b class="small">${esc(it.name||'Unnamed item')}</b><div class="tiny muted">${esc(it.retailerName)} · qty ${it.qty}${it.size?' · '+esc(it.size):''}${it.shade?' · '+esc(it.shade):''}</div></div>${it.restricted.length?pill('Under review','warn'):''}</div>`).join('')}</div>
  </div>
  ${note('<b>Next:</b> a person opens every link, confirms stock and the real price, then sends you one quote. It stays valid for '+st.quoteExpiryMins+' minutes because retailer prices move.','info','clock')}
 </div></div>`;
}

function customerStatusLine(o){
 const t=payTotals(o), q=o.quote?quoteCalc(o):null;
 if(quoteExpired(o))return {tone:'danger',ic:'clock',text:'Your quote has expired. Ask us for an updated one and we will recheck the prices.',cta:null};
 if(/Restricted|Manual review/i.test(o.status))return {tone:'warn',ic:'alert',text:'One of your items needs a closer look before we can quote. We will come back to you.',cta:null};
 if(o.status==='Quote sent'||o.status==='Awaiting initial payment')return {tone:'accent',ic:'card',text:'Your quote is ready. Review it and pay to start the purchase.',cta:{label:'View and pay quote',href:`#/quote/${o.ref}/${o.token}`}};
 if(o.status==='Zimbabwe shipping payment required'||o.status==='Cargo payment pending')return {tone:'ochre',ic:'scale',text:'Your parcel has been weighed. The Zimbabwe shipping charge is ready to pay.',cta:{label:'Pay Zimbabwe shipping',href:`#/pay/${o.ref}/${o.token}/cargo`}};
 if(o.status==='Additional payment required')return {tone:'warn',ic:'pound',text:'The retailer price changed. We need your decision before we buy.',cta:{label:'See what changed',href:`#/pay/${o.ref}/${o.token}/additional`}};
 if(o.status==='Substitute approval required')return {tone:'warn',ic:'alert',text:'An item is unavailable. We have suggested an alternative and need your approval.',cta:null};
 if(o.status==='Delivered')return {tone:'accent',ic:'check',text:'Delivered. Thank you for using Tenga.',cta:null};
 if(t.initialPaid&&!/cargo|transit|Zimbabwe|collection|Delivered/i.test(o.status))return {tone:'accent',ic:'check',text:'Paid. We are working through the purchase and will keep this page updated.',cta:null};
 return {tone:'info',ic:'clock',text:'We are checking price, availability and UK delivery. Your quote is on its way.',cta:null};
}

function viewTrack(ref,token){
 const o=getOrder(ref);
 if(!o||o.token!==token)return `<div class="narrow-s">${note('That tracking link is not valid. Check the link we sent you, or <a class="link" href="#/lookup">look up your reference</a>.','danger','lock')}</div>`;
 const t=payTotals(o), q=o.quote?quoteCalc(o):null, cur=JOURNEY_RANK[o.status]!=null?JOURNEY_RANK[o.status]:0;
 const s=customerStatusLine(o);
 const est=estimateCargo(o);
 const cargoDue=o.payments.find(p=>p.type==='cargo'&&['Payment link created','Payment not started','Payment pending'].includes(p.status));
 return `<div class="narrow"><div class="stack-l">
  <div class="spread wrap">
   <div class="stack-s">
     <div class="eyebrow">Order tracking</div>
     <div class="mono" style="font-size:26px;font-weight:700;letter-spacing:-.02em">${esc(o.ref)}</div>
     <div class="small muted">Submitted ${fmtDate(o.createdAt)} · for ${esc(o.recipient.name||o.customer.name)} in ${esc(o.recipient.town||'Zimbabwe')}</div>
   </div>
   <span class="pill p-${statusTone(o.status)}" style="font-size:12.5px;padding:5px 11px">${esc(o.status)}</span>
  </div>

  <div class="card card-p stack">
    <div class="note n-${s.tone}">${icon(s.ic,16)}<div>${s.text}</div></div>
    ${s.cta?`<a class="btn btn-primary btn-block btn-lg" href="${s.cta.href}">${s.cta.label}</a>`:''}
  </div>

  <div class="card">
   <div class="card-h"><b>Progress</b><span class="row tiny muted" style="gap:12px"><span class="row" style="gap:5px"><i style="width:8px;height:8px;border-radius:50%;background:var(--accent);display:block"></i>UK leg</span><span class="row" style="gap:5px"><i style="width:8px;height:8px;border-radius:50%;background:var(--ochre);display:block"></i>Zimbabwe leg</span></span></div>
   <div class="card-b"><div class="tl">
    ${JOURNEY.map((j,i)=>{
      const cls=i<cur?'done':i===cur?'now':'todo';
      const ev=o.timeline.slice().reverse().find(e=>JOURNEY_RANK[e.status]===i);
      return `<div class="tl-row ${cls} ${j.leg==='zw'?'zw':''}">
        <div class="tl-dot">${i<cur?icon('check',12):i===cur?`<i style="width:7px;height:7px;border-radius:50%;background:${j.leg==='zw'?'var(--ochre)':'var(--accent)'};display:block"></i>`:''}</div>
        <div class="stack-s" style="gap:2px">
          <div class="tl-t">${j.label}</div>
          <div class="tiny ${cls==='todo'?'muted':''}" style="color:${cls==='todo'?'':'var(--ink-2)'}">${j.desc}</div>
          ${ev&&i<=cur?`<div class="tiny muted mono">${fmtTime(ev.at)}</div>`:''}
        </div>
      </div>`}).join('')}
   </div></div>
  </div>

  <div class="card">
   <div class="card-h"><b>Your items</b><span class="tiny muted">${o.items.length} item${o.items.length>1?'s':''}</span></div>
   <div class="card-b stack-s">
    ${o.items.map(it=>{
      const v=[it.size,it.colour,it.shade,it.scent,it.variant].filter(Boolean).join(' · ');
      return `<div class="row" style="align-items:flex-start;padding:6px 0">${thumb(it)}
       <div class="grow stack-s" style="gap:3px">
         <b class="small">${esc(it.name||'Unnamed item')}</b>
         <div class="tiny muted">${esc(it.retailerName)} · qty ${it.qty}${v?' · '+esc(v):''}</div>
         ${it.purchase&&it.purchase.tracking?`<div class="tiny muted mono">UK tracking ${esc(it.purchase.tracking)} · ${esc(it.purchase.courier||'')}</div>`:''}
       </div>
       <div class="col" style="align-items:flex-end;gap:4px">
         <span class="mono small">${itemPrice(it)?money(itemLine(it)):'—'}</span>
         ${it.itemStatus&&it.itemStatus!=='Approved'?pill(it.itemStatus,statusTone(it.itemStatus)):''}
       </div></div>`}).join('')}
   </div>
  </div>

  <div class="card">
   <div class="card-h"><b>Payments</b></div>
   <div class="card-b stack">
    <div class="sum">
      <div class="l"><span>First payment, UK purchase</span><span class="v">${q?money(q.total):'Not quoted yet'}</span></div>
      <div class="l tiny muted"><span>Status</span><span class="v">${t.initialPaid?'Paid '+money(t.initialPaid):o.quote?'Awaiting payment':'Awaiting quote'}</span></div>
      <div class="l" style="margin-top:8px"><span>Zimbabwe shipping</span><span class="v">${o.cargo&&o.cargo.actualWeight?money(cargoCalc(o).total):'Estimated '+money(est.low)+' to '+money(est.high)}</span></div>
      <div class="l tiny muted"><span>Status</span><span class="v">${t.cargoPaid?'Paid '+money(t.cargoPaid):o.cargo&&o.cargo.actualWeight?'Confirmed by weight, awaiting payment':'Confirmed once weighed'}</span></div>
      ${t.refunded?`<div class="l" style="color:var(--danger)"><span>Refunded</span><span class="v">-${money(t.refunded)}</span></div>`:''}

    ${cargoDue?`<a class="btn btn-primary btn-block" href="#/pay/${o.ref}/${o.token}/cargo">${icon('card',16)}Pay Zimbabwe shipping ${money(cargoDue.amount)}</a>`:''}
   </div>
  </div>

  ${o.batchId?(()=>{const b=S.batches.find(x=>x.id===o.batchId);return b?`<div class="card"><div class="card-h"><b>Shipment</b>${pill(b.status,'ochre')}</div><div class="card-b stack-s small">
    <div class="spread"><span class="muted">Cargo company</span><b>${esc(b.company)}</b></div>
    <div class="spread"><span class="muted">Shipment reference</span><b class="mono">${esc(b.ref)}</b></div>
    <div class="spread"><span class="muted">Expected in Zimbabwe</span><b>${fmtDate(b.eta)}</b></div>
    <div class="spread"><span class="muted">${o.recipient.collection?'Collection point':'Delivery to'}</span><b>${esc(o.recipient.collection||o.recipient.address||o.recipient.town)}</b></div>
  </div></div>`:''})():''}

  <div class="card card-p stack-s">
    <div class="eyebrow">Need us</div>
    <div class="small">WhatsApp <b class="mono">+44 7700 900 000</b> or email <b>help@tenga.uk</b>. Quote your reference ${esc(o.ref)}.</div>
  </div>
 </div></div>`;
}

function viewQuote(ref,token){
 const o=getOrder(ref);
 if(!o||o.token!==token)return `<div class="narrow-s">${note('That link is not valid.','danger','lock')}</div>`;
 if(!o.quote||!o.quote.sentAt)return `<div class="narrow-s">${note('Your quote is not ready yet. We will email you as soon as it is.','info','clock')}</div>`;
 const q=quoteCalc(o), expired=quoteExpired(o), t=payTotals(o), est=estimateCargo(o);
 if(t.initialPaid)return `<div class="narrow-s"><div class="stack">${note('<b>This quote has been paid.</b> Thank you.','accent','check')}<a class="btn btn-primary" href="#/track/${o.ref}/${o.token}">Open tracking page</a></div></div>`;
 return `<div class="narrow"><div class="stack-l">
  <div class="spread wrap">
    <div class="stack-s"><div class="eyebrow">Quote</div><div class="mono" style="font-size:26px;font-weight:700">${esc(o.ref)}</div></div>
    ${expired?pill('Expired','danger'):`<span class="pill p-warn">${icon('clock',13)}${esc(until(o.quote.expiresAt))}</span>`}
  </div>
  ${expired?note('<b>This quote has expired.</b> Retailer prices move, so we need to recheck before you pay. Ask us for an updated quote and we will resend it.','danger','clock'):''}

  ${q.groups.map(g=>`<div class="retailer-grp">
    <div class="rg-h"><b>${esc(g.name)}</b><span class="mono tiny">${g.freeApplied?'Free UK delivery':'UK delivery '+money(g.delivery)}</span></div>
    <div style="padding:4px 0">
     ${g.items.map(it=>{const v=[it.size,it.colour,it.shade,it.scent,it.variant].filter(Boolean).join(' · ');
      return `<div class="row" style="align-items:flex-start;padding:11px 13px;border-bottom:1px solid var(--line)">
        ${thumb(it)}
        <div class="grow stack-s" style="gap:3px">
          <b class="small">${esc(it.name)}</b>
          ${v?`<div class="tiny muted">${esc(v)}</div>`:''}
          <div class="tiny muted">Qty ${it.qty} at ${money(itemPrice(it))} · <a class="link" href="${esc(it.url)}" target="_blank" rel="noopener">view on ${esc(g.name)} ${icon('ext',10)}</a></div>
          <div class="tiny muted">${it.subsAllowed==='yes'?'Substitutes allowed'+(it.subsNotes?': '+esc(it.subsNotes):''):it.subsAllowed==='cancel'?'Cancel and refund if unavailable':'Ask me before substituting'}</div>
        </div>
        <b class="mono">${money(itemLine(it))}</b>
      </div>`}).join('')}
    </div>
    <div class="spread small" style="padding:9px 13px"><span class="muted">${esc(g.name)} subtotal</span><b class="mono">${money(round2(g.subtotal+g.delivery))}</b></div>
  </div>`).join('')}

  <div class="card card-p">
   <div class="sum">
     <div class="l"><span>Product value</span><span class="v">${money(q.productTotal)}</span></div>
     <div class="l"><span>UK retailer delivery${q.groups.length>1?' ('+q.groups.length+' shops, charged separately)':''}</span><span class="v">${money(q.deliveryTotal)}</span></div>
     <div class="l"><span>Procurement fee <span class="tiny muted">(${S.settings.procurementPct}% of product value, min ${money(S.settings.procurementMin)})</span></span><span class="v">${money(q.fee)}</span></div>
     ${q.adjustments.map(a=>`<div class="l"><span>${esc(a.reason)}</span><span class="v">${a.delta<0?'-':''}${money(Math.abs(a.delta))}</span></div>`).join('')}
     <div class="l total"><span>Pay now</span><span class="v">${money(q.total)}</span></div>
   </div>
   <hr class="hr" style="margin:14px 0">
   <div class="sum">
     <div class="l"><span class="muted">Zimbabwe shipping, later</span><span class="v muted">est. ${money(est.low)} to ${money(est.high)}</span></div>
     <div class="tiny muted">Based on roughly ${est.kg} kg for what you have ordered, at ${money(S.settings.cargoRate)} per kg plus clearance. This is an estimate from product descriptions. The real figure comes from the scales, and we will ask you before shipping if it is higher.</div>
   </div>
  </div>

  <div class="card">
   <div class="card-h"><b>Delivering to</b></div>
   <div class="card-b field-grid small">
     <div class="stack-s" style="gap:2px"><span class="eyebrow">Recipient</span><b>${esc(o.recipient.name)}</b><span class="muted">${esc(o.recipient.phone)}</span></div>
     <div class="stack-s" style="gap:2px"><span class="eyebrow">In Zimbabwe</span><b>${esc(o.recipient.town)}</b><span class="muted">${esc(o.recipient.collection||o.recipient.address||'Address to confirm')}</span></div>
   </div>
  </div>

  <div class="card card-p stack">
   <div class="eyebrow">Before you pay, please confirm</div>
   <label class="check"><input type="checkbox" class="qc"><span>The products, sizes, shades and quantities above are correct.</span></label>
   <label class="check"><input type="checkbox" class="qc"><span>The recipient name, phone number and town are correct.</span></label>

     ${expired?`<button class="btn btn-block" data-act="requestNewQuote" data-ref="${o.ref}">${icon('refresh',16)}Request an updated quote</button>`:''}
   </div>
   <div class="tiny muted center">You are paying Tenga UK, not the retailer. We buy the item on your behalf.</div>
  </div>
 </div></div>`;

function viewPay(ref,token,kind){
 const o=getOrder(ref);
 if(!o||o.token!==token)return `<div class="narrow-s">${note('That link is not valid.','danger','lock')}</div>`;
 const p=o.payments.filter(x=>x.type===(kind||'initial')).slice(-1)[0];
 if(!p)return `<div class="narrow-s">${note('There is nothing to pay here right now.','info','check')}</div>`;
 if(['Payment completed','Payment available','Payment held'].includes(p.status))
   return `<div class="narrow-s"><div class="stack">${note('<b>This payment is already complete.</b>','accent','check')}<a class="btn btn-primary" href="#/track/${o.ref}/${o.token}">Back to tracking</a></div></div>`;
 const label=kind==='cargo'?'Zimbabwe shipping':kind==='additional'?'Additional payment':'UK purchase';
 return `<div class="narrow-s"><div class="stack-l">
  <div class="stack-s"><div class="eyebrow">${label} · ${esc(o.ref)}</div><h2 style="font-size:24px">Pay ${money(p.amount)}</h2></div>
  ${kind==='cargo'&&o.cargo?(()=>{const c=cargoCalc(o);return `<div class="card"><div class="card-h"><b>How this was worked out</b>${pill('Weighed','ochre')}</div><div class="card-b sum">
    <div class="l"><span>Actual weight</span><span class="v">${c.actual} kg</span></div>
    <div class="l"><span>Packaging</span><span class="v">${c.pack} kg</span></div>
    ${c.vol?`<div class="l"><span>Volumetric weight</span><span class="v">${c.vol} kg</span></div>`:''}
    <div class="l"><span>Chargeable weight</span><span class="v">${c.chargeable} kg</span></div>
    <div class="l"><span>Freight at ${money(c.rate)} per kg</span><span class="v">${money(c.freight)}</span></div>
    <div class="l"><span>Clearance</span><span class="v">${money(c.clearance)}</span></div>
    <div class="l"><span>Zimbabwe local delivery</span><span class="v">${money(c.local)}</span></div>
    ${c.other?`<div class="l"><span>Other cargo charges</span><span class="v">${money(c.other)}</span></div>`:''}
    <div class="l total"><span>Total</span><span class="v">${money(c.total)}</span></div>
  </div></div>`})():''}
  <div class="card card-p stack">

const QUEUES=[
 ['New requests',[
   ['new','New requests',o=>/Request submitted|Product information captured|Awaiting price confirmation|Awaiting UK delivery confirmation/.test(o.status)],
   ['review','Needs manual review',o=>/Manual review required|Restricted-product review/.test(o.status)||o.items.some(i=>i.restricted.length&&!i.restrictedCleared)],
   ['unapproved','Unapproved retailer',o=>o.items.some(i=>!i.retailerId||(retailerById(i.retailerId)||{}).status!=='approved')],
   ['missing','Missing product detail',o=>o.items.some(i=>!i.name||i.confirmedPrice==null)&&!o.quote]
 ]],
 ['Quotes',[
   ['qready','Ready to send',o=>!!o.quote&&!o.quote.sentAt],
   ['qsent','Awaiting payment',o=>!!o.quote&&!!o.quote.sentAt&&!payTotals(o).initialPaid&&!quoteExpired(o)],
   ['qexpired','Expired',o=>quoteExpired(o)]
 ]],
 ['Purchasing',[
   ['tobuy','Paid, to purchase',o=>payTotals(o).initialPaid>0&&activeItems(o).some(i=>!i.purchase)&&!/cargo|transit|Zimbabwe|Delivered|collection/i.test(o.status)],
   ['decision','Customer decision needed',o=>/Additional payment required|Customer decision required|Substitute approval required|Product out of stock/.test(o.status)],
   ['dispatch','Awaiting UK dispatch',o=>activeItems(o).some(i=>i.purchase&&!i.received)]
 ]],
 ['UK receiving',[
   ['receiving','To check in',o=>activeItems(o).some(i=>i.purchase&&!i.received)],
   ['issues','Goods with issues',o=>o.items.some(i=>(i.issues||[]).length)]
 ]],
 ['Cargo',[
   ['weight','Awaiting weight',o=>activeItems(o).length>0&&activeItems(o).every(i=>i.received)&&!(o.cargo&&o.cargo.actualWeight)],
   ['cargopay','Awaiting cargo payment',o=>!!(o.cargo&&o.cargo.actualWeight)&&!payTotals(o).cargoPaid],
   ['tobatch','Ready for a batch',o=>payTotals(o).cargoPaid>0&&!o.batchId]
 ]],
 ['Everything',[
   ['all','All orders',()=>true],
   ['open','Open orders',o=>o.status!=='Delivered'&&o.status!=='Closed'],
   ['done','Completed',o=>o.status==='Delivered'||o.status==='Closed']
 ]]
];
const QMAP={};QUEUES.forEach(g=>g[1].forEach(q=>QMAP[q[0]]={label:q[1],fn:q[2]}));
function qCount(k){return S.orders.filter(QMAP[k].fn).length}

 </div></div>`;
}

     ${acts.map(a=>`<a class="btn btn-s" href="#/admin/orders?q=${a.k}"><span class="pill p-${a.t}">${a.c}</span>${esc(a.l)}</a>`).join('')}

   </tbody></table></div>
  </div>

  <div class="card">
   <div class="card-h"><b>Latest orders</b><a class="link tiny" href="#/admin/orders?q=all">See all</a></div>

}

/* ---- reports ---- */
function adminReports(){
 const os=S.orders, n=os.length;
 const quoted=os.filter(o=>o.quote&&o.quote.sentAt).length;
 const paid=os.filter(o=>payTotals(o).initialPaid>0).length;
 const delivered=os.filter(o=>o.status==='Delivered');
 const avgVal=n?round2(os.reduce((a,o)=>a+quoteCalc(o).productTotal,0)/n):0;
 const avgFee=quoted?round2(os.filter(o=>o.quote&&o.quote.sentAt).reduce((a,o)=>a+quoteCalc(o).fee,0)/quoted):0;
 const avgDel=quoted?round2(os.filter(o=>o.quote&&o.quote.sentAt).reduce((a,o)=>a+quoteCalc(o).deliveryTotal,0)/quoted):0;
 const cargoOs=os.filter(o=>o.cargo&&o.cargo.actualWeight);
 const avgCargo=cargoOs.length?round2(cargoOs.reduce((a,o)=>a+cargoCalc(o).total,0)/cargoOs.length):0;
 const avgDays=delivered.length?round2(delivered.reduce((a,o)=>a+(o.timeline[o.timeline.length-1].at-o.createdAt)/86400e3,0)/delivered.length):0;
 const byRetailer={};os.forEach(o=>o.items.forEach(i=>{const k=i.retailerName||'Unknown';byRetailer[k]=(byRetailer[k]||0)+1}));
 const byTown={};os.forEach(o=>{const k=o.recipient.town||'Unknown';byTown[k]=(byTown[k]||0)+1});
 const byProduct={};os.forEach(o=>o.items.forEach(i=>{const k=(i.name||'').split(' ').slice(0,3).join(' ');if(k)byProduct[k]=(byProduct[k]||0)+i.qty}));
 const emails={};os.forEach(o=>{emails[o.customer.email]=(emails[o.customer.email]||0)+1});
 const repeat=Object.values(emails).filter(c=>c>1).length;
 const refunds=os.filter(o=>(o.refunds||[]).length).length;
 const oos=os.filter(o=>/out of stock|unavailable/i.test(o.status)).length;
 const restricted=os.filter(o=>o.items.some(i=>i.restricted.length)).length;
 const bar=(obj)=>{const e=Object.entries(obj).sort((a,b)=>b[1]-a[1]).slice(0,6);const max=Math.max(1,...e.map(x=>x[1]));
   return e.map(([k,v])=>`<div class="stack-s" style="gap:3px"><div class="spread small"><span>${esc(k)}</span><b class="mono">${v}</b></div>
   <div style="height:6px;background:var(--surface-2);border-radius:100px;overflow:hidden"><i style="display:block;height:100%;width:${v/max*100}%;background:var(--accent)"></i></div></div>`).join('')||'<div class="tiny muted">No data.</div>'};
 return `<div class="stack">
  <div class="stack-s"><div class="eyebrow">Reporting</div><h2 style="font-size:22px">How the business is running</h2></div>
  <div class="kpis">
    <div class="kpi"><span class="v num">${n}</span><span class="l">Requests submitted</span></div>
    <div class="kpi"><span class="v num">${n?Math.round(quoted/n*100):0}%</span><span class="l">Quote approval rate</span></div>
    <div class="kpi stripe-a"><span class="v num">${quoted?Math.round(paid/quoted*100):0}%</span><span class="l">Quote to payment conversion</span></div>
    <div class="kpi"><span class="v num">${money(avgVal)}</span><span class="l">Average product value</span></div>
    <div class="kpi"><span class="v num">${money(avgFee)}</span><span class="l">Average procurement fee</span></div>
    <div class="kpi"><span class="v num">${money(avgDel)}</span><span class="l">Average UK delivery</span></div>
    <div class="kpi stripe-o"><span class="v num">${money(avgCargo)}</span><span class="l">Average cargo charge</span></div>
    <div class="kpi"><span class="v num">${avgDays||'—'}</span><span class="l">Days, request to delivered</span></div>
    <div class="kpi"><span class="v num">${repeat}</span><span class="l">Repeat customers</span></div>
    <div class="kpi stripe-d"><span class="v num">${refunds}</span><span class="l">Orders with refunds</span></div>
    <div class="kpi stripe-w"><span class="v num">${oos}</span><span class="l">Out of stock events</span></div>
    <div class="kpi stripe-d"><span class="v num">${restricted}</span><span class="l">Restricted product flags</span></div>
  </div>
  <div class="field-grid two">
    <div class="card"><div class="card-h"><b>Orders by retailer</b></div><div class="card-b stack-s">${bar(byRetailer)}</div></div>
    <div class="card"><div class="card-h"><b>Orders by Zimbabwe destination</b></div><div class="card-b stack-s">${bar(byTown)}</div></div>
  </div>
  <div class="card"><div class="card-h"><b>Most requested products</b><span class="eyebrow">Candidates for local stock</span></div><div class="card-b stack-s">${bar(byProduct)}</div></div>
 </div>`;
}

function adminAudit(){
 return `<div class="stack">
  <div class="stack-s"><div class="eyebrow">Compliance</div><h2 style="font-size:22px">Audit log</h2></div>
  <div class="card"><div class="scroll-x"><table class="t">
   <thead><tr><th>When</th><th>Order</th><th>Action</th><th>Before</th><th>After</th><th>Reason</th><th>By</th></tr></thead>
   <tbody>${S.audit.map(a=>`<tr><td class="tiny muted nowrap">${fmtFull(a.at)}</td>
     <td>${a.ref?`<a class="link mono tiny" href="#/admin/order/${a.ref}">${a.ref}</a>`:'<span class="tiny muted">—</span>'}</td>
     <td class="small">${esc(a.action)}</td><td class="tiny muted">${esc(a.before||'—')}</td><td class="tiny"><b>${esc(a.after||'—')}</b></td>
     <td class="tiny muted">${esc(a.reason||'')}</td><td class="tiny muted">${esc(a.actor)}</td></tr>`).join('')||'<tr><td class="empty">Empty.</td></tr>'}

 </div>`;

/* ================================================================
   EVENTS
   ================================================================ */
function curRef(){const p=route().parts;return (p[0]==='admin'&&p[1]==='order')?p[2]:null}
function curOrder(){const r=curRef();return r?getOrder(r):null}
function val(id){const el=document.getElementById(id);return el?el.value.trim():''}
function rerender(keep){VIEW.keepScroll=!!keep;render()}
const RECALC=new Set(['confirmedPrice','qty','displayedPrice','estKg','actualWeight','packaging','l','w','h','rate','clearance','localDelivery','other']);

/* --- generic binding --- */
document.addEventListener('input',e=>{
 const el=e.target; if(!el.dataset)return;
 const v=el.type==='checkbox'?el.checked:el.value;
 const d=el.dataset;
 if(d.bind){const [a,b]=d.bind.split('.');const dr=draft();if(b)dr[a][b]=v;else dr[a]=v;save();return}
 const o=curOrder();
 if(d.item&&o){const it=o.items.find(i=>i.id===d.item);if(it){it[d.k]=(d.k==='qty'||d.k==='confirmedPrice'||d.k==='displayedPrice'||d.k==='estKg')?(v===''?(d.k==='confirmedPrice'?null:0):Number(v)):v;save()}return}
 if(d.pur&&o){const it=o.items.find(i=>i.id===d.pur);if(it){it.purchase=it.purchase||{};it.purchase[d.k]=v;save()}return}
 if(d.rec&&o){const it=o.items.find(i=>i.id===d.rec);if(it){it.recDraft=it.recDraft||{};it.recDraft[d.k]=v;save()}return}
 if(d.cargo&&o){o.cargo=o.cargo||{};o.cargo[d.cargo]=(v===''?'':(['company','shipRef','tracking','etaDate','dropoff'].includes(d.cargo)?v:Number(v)));save();return}
 if(d.ret){const r=retailerById(d.ret);if(r){r[d.k]=(d.k==='delivery'||d.k==='freeOver')?Number(v||0):v;save()}return}
 if(d.set){S.settings[d.set]=(typeof DEFAULT_SETTINGS[d.set]==='number')?Number(v||0):v;save();return}
 if(d.batch&&d.k){const b=S.batches.find(x=>x.id===d.batch);if(b){b[d.k]=v;save()}return}
});
document.addEventListener('change',e=>{
 const el=e.target,d=el.dataset||{};
 if(d.act)return; // handled below
 if(RECALC.has(d.k)||RECALC.has(d.cargo)||d.item||d.cargo)rerender(true);
});

/* --- select-driven actions --- */
document.addEventListener('change',e=>{
 const el=e.target,d=el.dataset||{};const act=d.act;if(!act)return;
 const o=d.ref?getOrder(d.ref):curOrder();
 if(act==='forceStatus'&&el.value){setStatus(o,el.value,'Set manually by administrator');save();rerender(true)}
 else if(act==='delOverride'){o.quote=o.quote||{deliveryOverrides:{},adjustments:[]};o.quote.deliveryOverrides=o.quote.deliveryOverrides||{};
   o.quote.deliveryOverrides[d.key]=el.value===''?null:Number(el.value);logAudit(o.ref,'UK delivery set for '+d.key,'',money(Number(el.value)||0));save();rerender(true)}
 else if(act==='payStatus'&&el.value){
   const p=o.payments.find(x=>x.id===d.id);const before=p.status;p.status=el.value;
   if(/completed|available/i.test(p.status)){p.paidAt=p.paidAt||Date.now();p.held=p.status==='Payment held'}
   if(p.status==='Payment held')p.held=true; else if(p.status==='Payment available')p.held=false;
   logAudit(o.ref,'Payment status changed',before,p.status);
   applyPaymentEffects(o,p);save();rerender(true)}
 else if(act==='raiseIssue'&&el.value){
   const it=o.items.find(i=>i.id===d.id);it.issues=it.issues||[];
   it.issues.push({type:el.value,at:Date.now(),notes:(it.recDraft&&it.recDraft.notes)||'',photos:[]});
   it.itemStatus='On hold';setStatus(o,'Receiving issue identified','Item: '+it.name+' — '+el.value);
   logAudit(o.ref,'Receiving issue logged','',el.value,it.name);
   logMsg(o.ref,'Goods issue identified','Email',o.customer.email,'We found an issue with one of your items ('+el.value+'). We are resolving it with the retailer and will update you.');
   save();rerender(true)}
 else if(act==='assignBatch'&&el.value){
   const b=S.batches.find(x=>x.id===d.batch);const ord=getOrder(el.value);
   if(b&&ord&&!b.orders.includes(ord.ref)){b.orders.push(ord.ref);ord.batchId=b.id;ord.cargo=ord.cargo||{};ord.cargo.company=b.company;ord.cargo.shipRef=b.ref;
     setStatus(ord,'Assigned to cargo batch',b.id);logAudit(ord.ref,'Assigned to cargo batch','',b.id);save();rerender(true);toast(ord.ref+' added to '+b.id)}}
});

/* --- clicks --- */
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]'); if(!el)return;
 const d=el.dataset, act=d.act;
 if(el.tagName==='SELECT')return;
 const o=d.ref?getOrder(d.ref):curOrder();
 const A={
  role(){ location.hash = d.v==='admin' ? '#/admin' : '#/'; },
  reset(){ if(confirm('Clear all demo data and start again with the seeded example orders?')){localStorage.removeItem(KEY);fresh();location.hash='#/';render();toast('Demo reset')} },
  tab(){ VIEW.adminTab=d.v; rerender(true); },
  openOrder(){ VIEW.adminTab='review'; go('#/admin/order/'+d.ref); },
  search(){ VIEW.search=val('adminSearch'); rerender(true); },

  /* customer request */
  fetch(){
    const url=val('linkInput'); const dr=draft(); dr.pendingUrl=url;
    if(!url){toast('Paste a product link first');return}
    const r=extract(url);
    if(!r.ok&&!['unapproved','disabled'].includes(r.reason)){dr.pending={reason:'badurl',msg:r.reason==='' ?'':r.reason};}
    else dr.pending=r;
    save();rerender(true);
  },
  clearPending(){ const dr=draft();dr.pending=null;dr.pendingUrl='';save();rerender(true) },
  addItem(){
    const dr=draft(),p=dr.pending;if(!p)return;
    const name=val('pName');
    if(!name){toast('Please give the product a name so we buy the right thing');return}
    const it=newItem({url:p.url,retailerId:p.retailerId,retailerName:p.retailerName,name,
      size:val('pSize'),colour:val('pColour'),shade:val('pShade'),scent:val('pScent'),variant:val('pVariant'),
      qty:Math.max(1,Number(val('pQty'))||1),displayedPrice:p.price,wasPrice:p.wasPrice,availability:p.availability,
      extractOk:!!p.price,subsAllowed:val('pSubs')||'no',subsNotes:val('pSubsNotes'),customerNotes:val('pNotes'),
      cancelIfUnavailable:val('pSubs')==='cancel'});
    it.restricted=restrictedHits([name,it.url,it.customerNotes].join(' '));
    dr.items.push(it);dr.pending=null;dr.pendingUrl='';save();rerender(true);
    toast(it.restricted.length?'Added. This item needs a manual check before we can quote.':'Added to your request');
  },
  addManual(){
    const dr=draft(),p=dr.pending;
    const it=newItem({url:p.url,retailerId:null,retailerName:p.retailerName,name:'',availability:'Needs manual check',itemStatus:'Manual review required'});
    it.restricted=restrictedHits(p.url);
    dr.items.push(it);dr.pending=null;dr.pendingUrl='';save();rerender(true);toast('Submitted for manual review');
  },
  delDraft(){ const dr=draft();dr.items.splice(Number(d.ix),1);save();rerender(true) },
  submitRequest(){
    const dr=draft();
    const miss=[];
    if(!dr.customer.name)miss.push('your name');if(!dr.customer.email)miss.push('your email');if(!dr.customer.whatsapp)miss.push('your WhatsApp number');
    if(!dr.recipient.name)miss.push('the recipient name');if(!dr.recipient.phone)miss.push('the recipient phone');if(!dr.recipient.town)miss.push('the town in Zimbabwe');
    if(miss.length){toast('Please add '+miss.join(', '));return}
    const o=newOrder({});
    Object.assign(o.customer,dr.customer);Object.assign(o.recipient,dr.recipient);
    o.items=dr.items;o.partOfLargerOrder=dr.partOfLargerOrder;o.customerNotes=dr.notes;
    S.orders.push(o);
    setStatus(o,'Product information captured');
    const flagged=o.items.some(i=>i.restricted.length);
    const unapproved=o.items.some(i=>!i.retailerId||(retailerById(i.retailerId)||{}).status!=='approved');
    if(flagged)setStatus(o,'Restricted-product review','Keywords: '+[...new Set(o.items.flatMap(i=>i.restricted))].join(', '));
    else if(unapproved)setStatus(o,'Manual review required','Retailer not on the approved list');
    else setStatus(o,'Awaiting price confirmation');
    logAudit(o.ref,'Request submitted','',o.items.length+' items','');
    logMsg(o.ref,'Request received','Email',o.customer.email,'We have received your request. We are checking the current product price, availability and UK delivery cost. You will receive a final quote before payment.');
    S.draft=null;save();go('#/submitted/'+o.ref);
  },
  lookup(){
    const r=val('lookupRef').toUpperCase();
    const o=S.orders.find(x=>x.ref.toUpperCase()===r);
    const box=document.getElementById('lookupMsg');
    if(o)go('#/track/'+o.ref+'/'+o.token);
    else if(box)box.innerHTML=note('We cannot find that reference. Check the email we sent you.','danger','alert');
  },

  /* customer payment */
  pay(){
    const boxes=[...document.querySelectorAll('.qc')];
    if(boxes.some(b=>!b.checked)){toast('Please tick all the confirmations first');return}
    const q=quoteCalc(o);
    let p=o.payments.filter(x=>x.type==='initial').slice(-1)[0];
    if(!p||['Payment failed','Payment cancelled'].includes(p.status)){p={id:uid('p'),type:'initial',provider:d.provider,amount:q.total,currency:'GBP',status:'Payment link created',ref:'PL-'+hash(o.ref+Date.now())%99999,createdAt:Date.now(),paidAt:null,held:false};o.payments.push(p)}
    p.provider=d.provider;p.amount=q.total;save();
    go('#/pay/'+o.ref+'/'+o.token+'/initial');
  },
  payNow(){
    const kind=d.kind||'initial';
    let p=o.payments.filter(x=>x.type===kind).slice(-1)[0];
    if(!p)return;
    p.provider=d.provider;p.status=(d.provider==='PayPal'&&kind==='initial')?'Payment held':'Payment completed';
    p.held=p.status==='Payment held';p.paidAt=Date.now();
    p.ref=(d.provider==='PayPal'?'PP-':'ch_')+hash(o.ref+p.id).toString(36).toUpperCase().slice(0,8);
    logAudit(o.ref,'Payment recorded','',p.status+' '+money(p.amount),d.provider);
    applyPaymentEffects(o,p);
    save();go('#/track/'+o.ref+'/'+o.token);
    toast(p.status==='Payment held'?'Payment received, funds held by PayPal':'Payment received');
  },
  requestNewQuote(){
    setStatus(o,'Awaiting price confirmation','Customer asked for an updated quote');
    o.quote.sentAt=null;o.quote.status='Recheck requested';
    logAudit(o.ref,'Updated quote requested','Quote expired','Awaiting price confirmation');
    logMsg(o.ref,'More information required','Email',o.customer.email,'We are rechecking prices and will send you an updated quote shortly.');
    save();rerender();toast('We will recheck and resend');
  },

  /* admin: review */
  approveItem(){ const it=o.items.find(i=>i.id===d.id);
    if(it.restricted.length&&!it.restrictedCleared){toast('Clear the restriction first');return}
    if(it.confirmedPrice==null||it.confirmedPrice===''){toast('Enter the confirmed unit price');return}
    it.itemStatus='Approved';logAudit(o.ref,'Item approved','',it.name,'Confirmed at '+money(it.confirmedPrice));save();rerender(true);toast('Item approved') },
  clearRestricted(){ const it=o.items.find(i=>i.id===d.id);const why=prompt('Why is this acceptable? Recorded in the audit log.','Not pressurised, cargo company confirmed acceptable');
    if(why===null)return;it.restrictedCleared=true;logAudit(o.ref,'Restriction cleared',it.restricted.join(', '),'Cleared',why);
    if(!o.items.some(i=>i.restricted.length&&!i.restrictedCleared))setStatus(o,'Awaiting price confirmation');save();rerender(true) },
  rejectItem(){ const it=o.items.find(i=>i.id===d.id);const why=prompt('Reason for rejecting this item?','Restricted by cargo rules');
    if(why===null)return;it.itemStatus='Removed';logAudit(o.ref,'Item rejected',it.name,'Removed',why);
    logMsg(o.ref,'Product unavailable','Email',o.customer.email,'We cannot buy "'+it.name+'". Reason: '+why+'. It has been removed from your request.');
    save();rerender(true);toast('Item rejected and removed') },
  buildQuote(){
    const q=quoteCalc(o);
    if(activeItems(o).some(i=>i.confirmedPrice==null)){toast('Confirm a price on every item first');return}
    if(o.items.some(i=>i.restricted.length&&!i.restrictedCleared)){toast('Restricted items must be cleared or rejected first');return}
    if(!q.meetsMin&&!confirm('Product value is '+money(q.productTotal)+', below the '+money(S.settings.minSpend)+' minimum. Build the quote anyway?'))return;
    o.quote=Object.assign({id:uid('q'),deliveryOverrides:{},adjustments:[],sentAt:null,expiresAt:null,expiryMins:S.settings.quoteExpiryMins,status:'Draft'},o.quote||{});
    o.quote.sentAt=null;
    setStatus(o,'Quote ready');logAudit(o.ref,'Quote built','',money(quoteCalc(o).total));
    save();VIEW.adminTab='quote';rerender();toast('Quote built, review the delivery charges')
  },
  addAdj(){ const amt=Number(val('adjAmt'));const why=val('adjReason');
    if(!amt||!why){toast('Enter both an amount and a reason');return}
    const before=quoteCalc(o).total;
    o.quote.adjustments=o.quote.adjustments||[];
    o.quote.adjustments.push({delta:round2(amt),reason:why,by:'Admin (demo)',at:Date.now()});
    logAudit(o.ref,'Manual quote adjustment',money(before),money(quoteCalc(o).total),why);
    save();rerender(true);toast('Adjustment recorded') },
  delAdj(){ const before=quoteCalc(o).total;const a=o.quote.adjustments.splice(Number(d.i),1)[0];
    logAudit(o.ref,'Adjustment removed',money(before),money(quoteCalc(o).total),a.reason);save();rerender(true) },
  sendQuote(){
    const mins=Number(val('expMins'))||S.settings.quoteExpiryMins;
    const q=quoteCalc(o);
    o.quote.expiryMins=mins;o.quote.sentAt=Date.now();o.quote.expiresAt=Date.now()+mins*60e3;o.quote.status='Sent';o.quote.total=q.total;
    let p=o.payments.filter(x=>x.type==='initial').slice(-1)[0];
    if(!p){p={id:uid('p'),type:'initial',provider:'PayPal',amount:q.total,currency:'GBP',status:'Payment link created',ref:'PL-'+hash(o.ref+Date.now())%99999,createdAt:Date.now(),paidAt:null,held:false};o.payments.push(p)}
    else if(!/completed|available|held/i.test(p.status))p.amount=q.total;
    setStatus(o,'Quote sent');setStatus(o,'Awaiting initial payment');
    logAudit(o.ref,'Quote sent','',money(q.total),'Expires in '+mins+' minutes');
    logMsg(o.ref,'Quote ready','Email',o.customer.email,'Your quote for '+o.ref+' is '+money(q.total)+'. It expires in '+mins+' minutes.');
    save();rerender(true);toast('Quote sent to '+o.customer.email)
  },

  /* admin: payments */
  mkPay(){
    const kind=d.kind;
    const amt=kind==='cargo'?cargoCalc(o).total:quoteCalc(o).total;
    if(!amt){toast('Nothing to charge');return}
    o.payments.push({id:uid('p'),type:kind,provider:'PayPal',amount:amt,currency:'GBP',status:'Payment link created',ref:'PL-'+hash(o.ref+Date.now())%99999,createdAt:Date.now(),paidAt:null,held:false});
    if(kind==='cargo'){setStatus(o,'Zimbabwe shipping payment required');
      logMsg(o.ref,'Cargo payment required','WhatsApp',o.customer.whatsapp,'Your parcel weighs '+cargoCalc(o).chargeable+' kg. Zimbabwe shipping is '+money(amt)+'. Pay here to book it onto the next shipment.');}
    logAudit(o.ref,'Payment request created','',kind+' '+money(amt));
    save();rerender(true);toast('Payment request created')
  },
  mkPayCustom(){
    const amt=Number(prompt('Additional payment amount in £','0'));if(!amt)return;
    const why=prompt('Reason shown to the customer','Retailer price increased after your payment')||'';
    o.payments.push({id:uid('p'),type:'additional',provider:'PayPal',amount:round2(amt),currency:'GBP',status:'Payment link created',ref:'PL-'+hash(o.ref+Date.now())%99999,createdAt:Date.now(),paidAt:null,held:false,reason:why});
    setStatus(o,'Additional payment required',why);
    logAudit(o.ref,'Additional payment requested','',money(amt),why);
    logMsg(o.ref,'Additional payment required','WhatsApp',o.customer.whatsapp,why+' We need a further '+money(amt)+' before we can complete the purchase.');
    save();rerender(true)
  },
  addRefund(){
    const amt=Number(val('refAmt'));if(!amt){toast('Enter an amount');return}
    o.refunds=o.refunds||[];
    o.refunds.push({amount:round2(amt),type:val('refType'),reason:val('refReason'),ref:'RF-'+hash(o.ref+Date.now()).toString(36).toUpperCase().slice(0,7),at:Date.now(),by:'Admin (demo)'});
    logAudit(o.ref,'Refund recorded','',money(amt),val('refReason'));
    logMsg(o.ref,'Refund issued','Email',o.customer.email,'We have refunded '+money(amt)+'. '+val('refReason'));
    const t=payTotals(o);setStatus(o,t.refunded>=t.initialPaid+t.cargoPaid?'Fully refunded':'Partially refunded');
    save();rerender(true);toast('Refund recorded')
  },
  releaseHold(){ const p=o.payments.find(x=>x.id===d.id);p.status='Payment available';p.held=false;
    logAudit(o.ref,'Payment released','Payment held','Payment available');applyPaymentEffects(o,p);save();rerender(true);toast('Marked available') },

  /* admin: purchase */
  savePurchase(){
    const it=o.items.find(i=>i.id===d.id);const p=it.purchase||{};
    if(!p.orderNumber){toast('Record the retailer order number');return}
    p.date=p.date||Date.now();p.by='Admin (demo)';
    if(p.etaDate)p.eta=new Date(p.etaDate).getTime();
    if(p.actualCost!=null&&p.actualCost!=='')p.actualCost=Number(p.actualCost);
    if(p.actualDelivery!=null&&p.actualDelivery!=='')p.actualDelivery=Number(p.actualDelivery);
    it.purchase=p;it.itemStatus='Purchased';
    const diff=p.actualCost!=null?round2(Number(p.actualCost)-itemLine(it)):0;
    logAudit(o.ref,'Retailer purchase recorded','',it.retailerName+' '+p.orderNumber, diff?('Price difference '+money(diff)):'');
    if(activeItems(o).every(i=>i.purchase)){setStatus(o,'Purchased from retailer');
      logMsg(o.ref,'Retailer purchase completed','Email',o.customer.email,'We have placed your order with the retailer. Order number '+p.orderNumber+'.');}
    else setStatus(o,'Retailer order partially placed');
    if(diff>S.settings.absorbIncrease)setStatus(o,'Additional payment required','Retailer price rose by '+money(diff));
    save();rerender(true);toast('Purchase recorded')
  },
  oos(){
    const it=o.items.find(i=>i.id===d.id);
    const kind=prompt('Type: temporarily out of stock, permanently unavailable, variant unavailable, quantity unavailable, or listing removed','temporarily out of stock');
    if(kind===null)return;
    it.itemStatus='Out of stock';
    if(it.subsAllowed==='yes'){setStatus(o,'Substitute approval required','Suggest an alternative for '+it.name);
      logMsg(o.ref,'Substitute approval required','WhatsApp',o.customer.whatsapp,it.name+' is '+kind+'. You said substitutes are acceptable ('+(it.subsNotes||'no detail given')+'). Please confirm the alternative we have suggested before we buy.');}
    else if(it.subsAllowed==='cancel'){setStatus(o,'Product out of stock','Customer asked to cancel and refund');
      logMsg(o.ref,'Product unavailable','Email',o.customer.email,it.name+' is '+kind+'. As instructed we will cancel this item and refund it.');}
    else {setStatus(o,'Customer decision required',it.name+' is '+kind);
      logMsg(o.ref,'Product unavailable','WhatsApp',o.customer.whatsapp,it.name+' is '+kind+'. Options: wait for restock, accept a substitute, choose something else, reduce the quantity, refund this item, or cancel the order.');}
    logAudit(o.ref,'Item marked unavailable',it.name,kind);
    save();rerender(true)
  },
  askMore(){ A.mkPayCustom() },
  cancelItem(){
    const it=o.items.find(i=>i.id===d.id);
    if(!confirm('Cancel "'+it.name+'" and record a refund of '+money(itemLine(it))+'?'))return;
    o.refunds=o.refunds||[];
    o.refunds.push({amount:itemLine(it),type:'Item-level refund',reason:'Item cancelled: '+it.name,ref:'RF-'+hash(it.id).toString(36).toUpperCase().slice(0,7),at:Date.now(),by:'Admin (demo)'});
    it.itemStatus='Refunded';
    logAudit(o.ref,'Item cancelled and refunded',it.name,money(itemLine(it)));
    logMsg(o.ref,'Refund issued','Email',o.customer.email,'We have cancelled "'+it.name+'" and refunded '+money(itemLine(it))+'.');
    setStatus(o,activeItems(o).length?'Partially refunded':'Fully refunded');
    save();rerender(true)
  },

  /* admin: receiving */
  receive(){
    const it=o.items.find(i=>i.id===d.id);const rd=it.recDraft||{};
    it.received={at:Date.now(),qtyReceived:Number(rd.qtyReceived||it.qty),condition:rd.condition||'Good',
      variantOk:(rd.variantOk||'Yes')==='Yes',photos:String(rd.photos||'').split(',').map(s=>s.trim()).filter(Boolean),notes:rd.notes||'',by:'Admin (demo)'};
    it.itemStatus='Received';delete it.recDraft;
    logAudit(o.ref,'Goods checked in',it.name,it.received.condition,'Qty '+it.received.qtyReceived);
    if(activeItems(o).every(i=>i.received)){setStatus(o,'Received and checked');setStatus(o,'Awaiting final weight');
      logMsg(o.ref,'Goods received in the UK','Email',o.customer.email,'Everything has arrived at our UK address and passed inspection. Next we weigh the parcel and confirm the Zimbabwe shipping charge.');}
    else setStatus(o,'Partially received');
    save();rerender(true);toast('Checked in')
  },

  /* admin: cargo */
  saveCargo(){
    o.cargo=o.cargo||{};
    if(o.cargo.etaDate)o.cargo.eta=new Date(o.cargo.etaDate).getTime();
    const sel=document.querySelector('[data-cargo2="batchId"]');
    if(sel){const bid=sel.value||null;
      if(bid!==o.batchId){
        S.batches.forEach(b=>{b.orders=b.orders.filter(r=>r!==o.ref)});
        if(bid){const b=S.batches.find(x=>x.id===bid);b.orders.push(o.ref);o.cargo.company=o.cargo.company||b.company;setStatus(o,'Assigned to cargo batch',bid)}
        o.batchId=bid;logAudit(o.ref,'Cargo batch changed','',bid||'none');
      }}
    const c=cargoCalc(o);
    logAudit(o.ref,'Cargo details saved','',c.chargeable+' kg, '+money(c.total));
    if(o.cargo.actualWeight&&!payTotals(o).cargoPaid)setStatus(o,'Awaiting final weight');
    save();rerender(true);toast('Cargo details saved')
  },
  handOver(){
    setStatus(o,'Packed for Zimbabwe');setStatus(o,'Handed to cargo company');
    logAudit(o.ref,'Handed to cargo company','',o.cargo.company||'cargo partner');
    logMsg(o.ref,'Handed to cargo company','WhatsApp',o.customer.whatsapp,'Your parcel has been handed to '+(o.cargo.company||'the cargo company')+'. Reference '+(o.cargo.shipRef||'to follow')+'.');
    save();rerender(true);toast('Handed over')
  },

  /* admin: comms */
  sendMsg(){
    const t=val('tplSel'),ch=val('tplChan');
    const to=ch==='Email'?o.customer.email:o.customer.whatsapp;
    logMsg(o.ref,t,ch,to,TEMPLATE_BODY(t,o));
    logAudit(o.ref,'Message sent','',t+' via '+ch);
    save();rerender(true);toast(t+' sent via '+ch)
  },

  /* config */
  addRetailer(){
    const name=prompt('Retailer name');if(!name)return;
    const dom=prompt('Domain, for example example.co.uk');if(!dom)return;
    S.retailers.push({id:uid('r'),name,domains:[dom.replace(/^https?:\/\//,'').replace(/^www\./,'').split('/')[0]],status:'manual',delivery:3.99,freeOver:0,autoExtract:false,notes:'New retailer, manual review until trusted.'});
    logAudit('','Retailer added','',name);save();rerender(true)
  },
  addKw(){ const k=val('kwNew').toLowerCase();if(!k)return;if(!S.restricted.includes(k))S.restricted.push(k);logAudit('','Restricted keyword added','',k);save();rerender(true) },
  delKw(){ const k=S.restricted.splice(Number(d.i),1)[0];logAudit('','Restricted keyword removed',k,'');save();rerender(true) },
  saveSettings(){ logAudit('','Business rules updated','',JSON.stringify(S.settings).slice(0,90)+'…');save();rerender(true);toast('Settings saved') },
  addBatch(){
    const company=prompt('Cargo company','Swift Cargo Zimbabwe');if(!company)return;
    const id='BATCH-'+String(S.batches.length+1).padStart(4,'0');
    S.batches.push({id,company,shipDate:Date.now(),eta:Date.now()+10*86400e3,ref:'',manifest:'',status:'Packed for Zimbabwe',orders:[]});
    logAudit('','Cargo batch created','',id);save();rerender(true)
  },
  saveBatch(){ const b=S.batches.find(x=>x.id===d.batch);
    if(b.shipDate&&typeof b.shipDate==='string')b.shipDate=new Date(b.shipDate).getTime();
    if(b.eta&&typeof b.eta==='string')b.eta=new Date(b.eta).getTime();
    logAudit('','Cargo batch saved','',b.id);save();rerender(true);toast('Batch saved') },
  pushBatchStatus(){ const b=S.batches.find(x=>x.id===d.batch);
    b.orders.forEach(r=>{const ord=getOrder(r);if(ord){setStatus(ord,b.status,'Batch '+b.id);
      logMsg(r,b.status,'WhatsApp',ord.customer.whatsapp,'Update on '+r+': '+b.status+'.')}});
    logAudit('','Batch status applied','',b.status+' to '+b.orders.length+' orders');save();rerender(true);toast('Applied to '+b.orders.length+' orders') }
 };
 if(A[act]){e.preventDefault();A[act]()}
});

function TEMPLATE_BODY(t,o){
 const q=o.quote?quoteCalc(o):null, c=o.cargo&&o.cargo.actualWeight?cargoCalc(o):null;
 const M={
  'Request received':'We have received your request. We are checking the current product price, availability and UK delivery cost. You will receive a final quote before payment.',
  'Quote ready':'Your quote for '+o.ref+' is '+(q?money(q.total):'')+'. It expires in '+(o.quote&&o.quote.expiryMins||60)+' minutes.',
  'Quote expiring':'Your quote for '+o.ref+' expires shortly. Prices move, so we will need to recheck if it lapses.',
  'Payment received':'We have received your payment for '+o.ref+'. We will now place the retailer order. Zimbabwe shipping is charged separately.',
  'Cargo payment required':'Your parcel has been weighed'+(c?' at '+c.chargeable+' kg':'')+'. Zimbabwe shipping is '+(c?money(c.total):'')+'.',
  'Ready for collection':'Your parcel has arrived and is ready for collection'+(o.recipient.collection?' at '+o.recipient.collection:'')+'. Bring ID.',
  'Delivered':'Your order '+o.ref+' has been delivered. Thank you for using Tenga.'
 };
 return M[t]||(t+' update for order '+o.ref+'.');
}

function applyPaymentEffects(o,p){
 if(!/completed|available|held/i.test(p.status))return;
 if(p.type==='initial'){
   setStatus(o,p.status==='Payment held'?'Initial payment held':'Initial payment completed');
   setStatus(o,'Paid — awaiting retailer purchase');
   if(o.quote)o.quote.status='Accepted';
   logMsg(o.ref,'Payment received','Email',o.customer.email,'We have received '+money(p.amount)+' for '+o.ref+'. The retailer purchase will now be placed. Zimbabwe shipping will be charged separately once the parcel is weighed.');
 } else if(p.type==='cargo'){
   setStatus(o,'Cargo payment received');setStatus(o,'Ready for cargo');
   logMsg(o.ref,'Cargo payment received','Email',o.customer.email,'Thank you, your Zimbabwe shipping payment of '+money(p.amount)+' has been received. Your parcel will go on the next shipment.');
 } else {
   setStatus(o,'Purchase in progress','Additional payment received');
 }
}

/* ================================================================
   BOOT
   ================================================================ */
if(!load())fresh();
if(!S.batches)S.batches=[];
render();
</script>
