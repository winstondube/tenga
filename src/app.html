<title>Tenga UK · Buy-for-me and Zimbabwe forwarding</title>

<style>
:root{
  --bg:#F0F3F0;
  --surface:#FFFFFF;
  --surface-2:#EDECE6;
  --ink:#12181A;
  --ink-2:#3E4845;
  --ink-3:#6C7671;
  --line:#DCDAD1;
  --line-2:#C8C6BC;
  --accent:#0B5D4E;
  --accent-soft:#E2EDE9;
  --accent-ink:#08463A;
  --ochre:#B57A1F;
  --ochre-soft:#F5EAD6;
  --ochre-ink:#8A5B12;
  --danger:#A33327;
  --danger-soft:#F7E4E1;
  --warn:#8A6100;
  --warn-soft:#F7EDD6;
  --info:#3A5C77;
  --info-soft:#E3EBF1;
  --shadow:0 1px 2px rgba(18,24,26,.05), 0 8px 24px -12px rgba(18,24,26,.18);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
  --r:4px;
  --on-accent:#FFFFFF;--drench:#0B2620;--gold:#E0AE5C;--on-drench:#F0F3F0;--on-drench-2:#A9BDB6;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0C1211;--surface:#171C1D;--surface-2:#1F2526;--ink:#EDEFEC;--ink-2:#B6BEBA;--ink-3:#818B87;
    --line:#2B3234;--line-2:#3A4244;--accent:#4FBFA4;--accent-soft:#12302A;--accent-ink:#8FDCC7;
    --ochre:#D9A64E;--ochre-soft:#33280F;--ochre-ink:#EFC988;
    --danger:#E8897B;--danger-soft:#37201C;--warn:#D9B45F;--warn-soft:#33290F;--info:#8FB6D4;--info-soft:#17252F;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
    --on-accent:#08201B;--drench:#081D19;--gold:#E0AE5C;--on-drench:#EAEFEC;--on-drench-2:#9AB0A9;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1211;--surface:#171C1D;--surface-2:#1F2526;--ink:#EDEFEC;--ink-2:#B6BEBA;--ink-3:#818B87;
  --line:#2B3234;--line-2:#3A4244;--accent:#4FBFA4;--accent-soft:#12302A;--accent-ink:#8FDCC7;
  --ochre:#D9A64E;--ochre-soft:#33280F;--ochre-ink:#EFC988;
  --danger:#E8897B;--danger-soft:#37201C;--warn:#D9B45F;--warn-soft:#33290F;--info:#8FB6D4;--info-soft:#17252F;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
    --on-accent:#08201B;--drench:#081D19;--gold:#E0AE5C;--on-drench:#EAEFEC;--on-drench-2:#9AB0A9;
}
:root[data-theme="light"]{
  --bg:#F0F3F0;--surface:#FFFFFF;--surface-2:#EDECE6;--ink:#12181A;--ink-2:#3E4845;--ink-3:#6C7671;
  --line:#DCDAD1;--line-2:#C8C6BC;--accent:#0B5D4E;--accent-soft:#E2EDE9;--accent-ink:#08463A;
  --ochre:#B57A1F;--ochre-soft:#F5EAD6;--ochre-ink:#8A5B12;
  --danger:#A33327;--danger-soft:#F7E4E1;--warn:#8A6100;--warn-soft:#F7EDD6;--info:#3A5C77;--info-soft:#E3EBF1;
  --shadow:0 1px 2px rgba(18,24,26,.05), 0 8px 24px -12px rgba(18,24,26,.18);
  --on-accent:#FFFFFF;--drench:#0B2620;--gold:#E0AE5C;--on-drench:#F0F3F0;--on-drench-2:#A9BDB6;
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:620;letter-spacing:-.01em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
svg{display:block}
.num{font-variant-numeric:tabular-nums}

/* ---------- primitives ---------- */
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.tiny{font-size:12px}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
.spread{display:flex;gap:12px;align-items:center;justify-content:space-between}
.col{display:flex;flex-direction:column}
.stack{display:flex;flex-direction:column;gap:14px}
.stack-s{display:flex;flex-direction:column;gap:8px}
.stack-l{display:flex;flex-direction:column;gap:26px}
.grow{flex:1;min-width:0}
.hr{height:1px;background:var(--line);border:0;margin:0}
.center{text-align:center}
.nowrap{white-space:nowrap}

.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);cursor:pointer;font-size:14px;font-weight:520;transition:background .13s,border-color .13s,transform .06s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(.5px)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent-ink);border-color:var(--accent-ink);color:var(--on-accent)}
.btn-danger{color:var(--danger);border-color:var(--danger)}
.btn-danger:hover{background:var(--danger-soft)}
.btn-s{padding:5px 10px;font-size:13px}
.btn-xs{padding:3px 8px;font-size:12px}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ghost:hover{background:var(--surface-2)}
.btn-block{width:100%;justify-content:center}
.btn-lg{padding:12px 20px;font-size:15.5px}

label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:560;color:var(--ink-2)}
label.f > .hint{font-weight:400;color:var(--ink-3);font-size:12px}
input[type=text],input[type=email],input[type=tel],input[type=url],input[type=number],input[type=date],select,textarea{
  width:100%;padding:8px 10px;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);font-size:14px;font-weight:400;color:var(--ink)}
textarea{resize:vertical;min-height:64px;font-family:var(--sans)}
input:disabled,select:disabled{background:var(--surface-2);color:var(--ink-3)}
.field-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.field-grid > label.f{align-self:end}
.field-grid.two{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.check{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;color:var(--ink-2);cursor:pointer}
.check input{margin-top:3px;accent-color:var(--accent);flex:none}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.card-p{padding:18px}
.card-h{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
.card-b{padding:16px}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:100px;font-size:11.5px;font-weight:600;font-family:var(--mono);letter-spacing:.02em;white-space:nowrap;border:1px solid transparent}
.p-accent{background:var(--accent-soft);color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent) 24%,transparent)}
.p-ochre{background:var(--ochre-soft);color:var(--ochre-ink);border-color:color-mix(in srgb,var(--ochre) 26%,transparent)}
.p-danger{background:var(--danger-soft);color:var(--danger);border-color:color-mix(in srgb,var(--danger) 26%,transparent)}
.p-warn{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 26%,transparent)}
.p-info{background:var(--info-soft);color:var(--info);border-color:color-mix(in srgb,var(--info) 26%,transparent)}
.p-mute{background:var(--surface-2);color:var(--ink-3);border-color:var(--line)}

.note{padding:11px 13px;border-radius:var(--r);font-size:13.5px;display:flex;gap:9px;align-items:flex-start;line-height:1.5}
.note svg{flex:none;margin-top:2px}
.n-accent{background:var(--accent-soft);color:var(--accent-ink)}
.n-warn{background:var(--warn-soft);color:var(--warn)}
.n-danger{background:var(--danger-soft);color:var(--danger)}
.n-info{background:var(--info-soft);color:var(--info)}
.n-mute{background:var(--surface-2);color:var(--ink-2)}

table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr.clickable{cursor:pointer}
table.t tbody tr.clickable:hover{background:var(--surface-2)}
.scroll-x{overflow-x:auto}

.thumb{position:relative;width:46px;height:46px;flex:none;border-radius:3px;display:grid;place-items:center;font-family:var(--mono);font-size:13px;font-weight:700;color:#fff;letter-spacing:.02em;border:1px solid rgba(0,0,0,.08);overflow:hidden}
.thumb.lg{width:72px;height:72px;font-size:18px}
/* Stays invisible until it actually decodes. A retailer CDN that hangs or
   refuses the hotlink then leaves the generated swatch showing, rather than
   a white box that never resolves. */
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .18s}
.thumb img.ok{opacity:1;background:#fff}
summary::-webkit-details-marker{display:none}
summary::marker{content:""}
.faq-list summary::marker{content:""}
details[open] > summary{border-bottom:1px solid var(--line)}
.route-pick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.route-pick{grid-template-columns:1fr}}
.route-card{border:1px solid var(--line-2);border-radius:var(--r);padding:14px;background:var(--surface);
  display:flex;flex-direction:column;gap:8px}
.route-card .rc-h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:15px}
.route-card .rc-amt{font-size:27px;font-weight:700;line-height:1;letter-spacing:-.01em}
.route-card .rc-line{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--ink-2);
  border-top:1px solid var(--line);padding-top:7px}
.route-card .rc-when{font-size:12px;color:var(--ink-3);flex:1}
.ship-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ship-opt{display:flex;flex-direction:column;gap:3px;text-align:left;padding:11px 12px;border:1px solid var(--line-2);
  border-radius:var(--r);background:var(--surface);cursor:pointer;font:inherit;color:inherit}
.ship-opt:hover{border-color:var(--ink-3)}
.ship-opt.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--surface-2)}
.ship-opt .so-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-size:14.5px}
.ship-opt .so-w{font-size:12px;color:var(--ink-2);line-height:1.35}
.ship-opt .so-y{font-size:11.5px;color:var(--ink-3);font-family:var(--mono)}
@media (max-width:480px){.ship-opts{grid-template-columns:1fr}}
.spin{width:15px;height:15px;border:2px solid var(--line-2);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- shell ---------- */
.topbar{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1400px;margin:0 auto;padding:9px 20px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-weight:700;font-size:14px;letter-spacing:-.02em;text-decoration:none}
.brand .mark{width:22px;height:22px;border-radius:3px;background:var(--accent);display:grid;place-items:center;color:var(--on-accent)}
.brand .tld{color:var(--ochre)}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:2px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink-3);font-family:var(--mono);letter-spacing:.03em}
.top-nav{display:flex;gap:18px;margin-left:auto;flex-wrap:wrap}
.top-nav a{font-size:13.5px;color:var(--ink-2);text-decoration:none}
.top-nav a:hover{color:var(--ink);text-decoration:underline}
@media (max-width:760px){.top-nav{display:none}}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}

.shell{max-width:1400px;margin:0 auto;padding:22px 20px 80px}
.narrow{max-width:800px;margin:0 auto;padding:28px 20px 80px}
.home-in{max-width:1180px;margin:0 auto;padding:clamp(34px,5vw,56px) 24px 80px}
.home-in .prose{max-width:68ch}
.narrow-s{max-width:620px;margin:0 auto;padding:28px 20px 80px}

/* ---------- admin shell ---------- */
.admin{display:grid;grid-template-columns:232px minmax(0,1fr);gap:22px;align-items:start}
.admin > *{min-width:0}
.rail{position:sticky;top:60px;display:flex;flex-direction:column;gap:18px}
.rail-grp{display:flex;flex-direction:column;gap:1px}
.rail-grp > .eyebrow{padding:0 8px 6px}
.rail a{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:3px;text-decoration:none;font-size:13.5px;color:var(--ink-2)}
.rail a:hover{background:var(--surface-2)}
.rail a.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:inset 2px 0 0 var(--accent)}
.rail a .cnt{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-3);background:var(--surface-2);padding:0 6px;border-radius:100px;min-width:20px;text-align:center}
.rail a.on .cnt{background:var(--accent-soft);color:var(--accent-ink)}
.rail a .cnt.hot{background:var(--danger-soft);color:var(--danger)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;display:flex;flex-direction:column;gap:3px}
.kpi .v{font-family:var(--mono);font-size:23px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.kpi .l{font-size:12px;color:var(--ink-3)}
.kpi.stripe-a{box-shadow:inset 0 -2px 0 var(--accent)}
.kpi.stripe-d{box-shadow:inset 0 -2px 0 var(--danger)}
.kpi.stripe-o{box-shadow:inset 0 -2px 0 var(--ochre)}
.kpi.stripe-w{box-shadow:inset 0 -2px 0 var(--warn)}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;margin-bottom:0}
.tabs button{border:0;background:transparent;padding:9px 13px;cursor:pointer;font-size:13.5px;font-weight:560;color:var(--ink-3);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--danger);margin-left:5px;vertical-align:middle}

/* ---------- timeline ---------- */
.tl{display:flex;flex-direction:column;gap:0;position:relative}
.tl-row{display:grid;grid-template-columns:22px 1fr;gap:12px;padding-bottom:16px;position:relative}
.tl-row:last-child{padding-bottom:0}
.tl-row::before{content:"";position:absolute;left:10px;top:18px;bottom:0;width:1px;background:var(--line-2)}
.tl-row:last-child::before{display:none}
.tl-dot{width:21px;height:21px;border-radius:50%;border:1px solid var(--line-2);background:var(--surface);display:grid;place-items:center;z-index:1}
.tl-row.done .tl-dot{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tl-row.done.zw .tl-dot{background:var(--ochre);border-color:var(--ochre)}
.tl-row.now .tl-dot{border-color:var(--accent);border-width:2px;background:var(--surface)}
.tl-row.now.zw .tl-dot{border-color:var(--ochre)}
.tl-row.done::before{background:var(--accent)}
.tl-row.done.zw::before{background:var(--ochre)}
.tl-t{font-weight:600;font-size:14px}
.tl-row.todo .tl-t{color:var(--ink-3);font-weight:500}

/* ---------- misc ---------- */
.item-card{border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.item-head{display:flex;gap:12px;padding:13px;align-items:flex-start}
.retailer-grp{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.retailer-grp > .rg-h{background:var(--surface-2);padding:8px 13px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px}
.sum{display:flex;flex-direction:column;gap:6px;font-size:14px}
.sum .l{display:flex;justify-content:space-between;gap:16px}
.sum .l.total{border-top:1px solid var(--line-2);margin-top:5px;padding-top:9px;font-weight:700;font-size:16px}
.sum .l .v{font-family:var(--mono);font-variant-numeric:tabular-nums}

.modal-bg{position:fixed;inset:0;background:rgba(10,14,15,.45);z-index:100;display:grid;place-items:center;padding:20px;overflow:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);max-width:520px;width:100%;box-shadow:var(--shadow);margin:auto}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:100px;font-size:13.5px;z-index:200;box-shadow:var(--shadow);animation:tin .2s ease}
@keyframes tin{from{opacity:0;transform:translateX(-50%) translateY(6px)}}

.hero-lede{font-family:var(--serif);font-size:clamp(30px,5.4vw,46px);line-height:1.1;letter-spacing:-.02em;font-weight:400}
.hero-lede em{font-style:italic;color:var(--accent)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.step{background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:6px}
.step .n{font-family:var(--mono);font-size:11px;color:var(--accent);font-weight:700}
.step.zw .n{color:var(--ochre)}

.empty{padding:40px 20px;text-align:center;color:var(--ink-3);font-size:14px}
.link{color:var(--accent);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.foot{border-top:1px solid var(--line);margin-top:50px;padding:20px;text-align:center;font-size:12.5px;color:var(--ink-3)}
.foot a{color:var(--ink-2)}


/* ---------- hero: committed viridian, the product wearing its own price ---------- */
.hero{position:relative;background:var(--drench);color:var(--on-drench);overflow:clip;isolation:isolate}
.hero::after{content:"";position:absolute;inset:auto 0 0;height:1px;background:linear-gradient(90deg,#2E7F6C 0%,#2E7F6C 42%,var(--gold) 58%,var(--gold) 100%);opacity:.55}
.hero-in{max-width:1180px;margin:0 auto;padding:clamp(38px,7vw,84px) 24px clamp(44px,7vw,80px);
  display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:clamp(28px,5vw,64px);align-items:center}
.hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(2.5rem,6.4vw,4.6rem);line-height:1.03;letter-spacing:-.025em;color:var(--on-drench)}
.hero h1 .zw{color:var(--gold);font-style:italic}
.hero-sub{margin-top:18px;font-size:clamp(15.5px,1.5vw,18px);line-height:1.6;color:var(--on-drench-2);max-width:44ch}
.hero-form{margin-top:26px;max-width:520px}
.hero-field{display:flex;gap:8px;background:var(--on-drench);border-radius:6px;padding:6px;box-shadow:0 12px 32px -18px rgba(0,0,0,.85)}
.hero-field input{flex:1;min-width:0;border:0;background:transparent;padding:11px 12px;font-size:15px;color:#101614}
.hero-field input::placeholder{color:#5C6A64}
.hero-field input:focus{outline:none}
.hero-field:focus-within{box-shadow:0 0 0 2px var(--gold),0 12px 32px -18px rgba(0,0,0,.85)}
.hero-go{border:0;border-radius:4px;background:var(--drench);color:var(--on-drench);padding:0 18px;font-size:14.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s}
.hero-go:hover{background:#164036}
.hero-detect{min-height:20px;margin-top:10px;font-size:13px;color:var(--on-drench-2);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hero-detect:empty{min-height:0;margin-top:0}
.hero-detect b{color:var(--on-drench)}
.hero-detect .ok{color:var(--gold)}

.shelf-row.r2{animation:slideR 70s linear infinite}

@keyframes slideR{from{transform:translateX(-50%)}to{transform:translateX(0)}}

.shelf-tile img{width:100%;height:100%;object-fit:cover;display:block;opacity:.5}
.shelf-fade{position:absolute;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(90deg,var(--drench) 0%,transparent 15%,transparent 85%,var(--drench) 100%)}
.shelf-pick{position:absolute;left:50%;top:calc(50% + var(--picky,0px));width:154px;height:154px;margin:-77px 0 0 -77px;border-radius:8px;

  outline:2px solid var(--gold);outline-offset:2px}

@keyframes pick{
  0%{opacity:0;transform:scale(.72)}
  13%{opacity:1;transform:scale(1)}

  color:#101614;border-radius:5px;padding:7px 13px;font-family:var(--mono);font-size:12.5px;font-weight:700;

  text-transform:uppercase;color:var(--gold);background:rgba(11,38,32,.85);

@media (prefers-reduced-motion:reduce){

const STOP=new Set(['p','dp','product','products','shop','uk','en','gb','item','ref','sku','html','buy','detail','details','pd','prd','g','a','c','b']);
function titleCase(s){return s.replace(/\b[a-z]/g,c=>c.toUpperCase())}
function extract(url){
 const out={ok:false,url:url,retailerId:null,retailerName:'',name:'',price:null,wasPrice:null,size:'',variant:'',availability:'Unknown',reason:''};
 let u;
 try{u=new URL(url.trim().match(/^https?:\/\//i)?url.trim():'https://'+url.trim())}catch(e){out.reason='That does not look like a web address.';return out}
 const host=u.hostname.replace(/^www\./,'').toLowerCase();
 const r=S.retailers.find(x=>x.domains.some(d=>host===d||host.endsWith('.'+d)));
 out.host=host;
 // Any UK shop. The retailer list is shops whose delivery rules we have
 // recorded, not a gate: an unknown shop simply means we confirm the
 // delivery cost by hand, which we do for every order anyway.
 if(!r){out.retailerId=null;out.retailerName=host;out.newShop=true}
 else {out.retailerId=r.id;out.retailerName=r.name;if(r.notes)out.retailerNotes=r.notes}
 const segs=u.pathname.split('/').filter(Boolean).map(s=>decodeURIComponent(s));
 // Take the wordiest segment, not the last one. LookFantastic and Cult Beauty
 // put the product id last (/the-ordinary-niacinamide-30ml/11363576.html), so
 // popping the tail returned a bare number and the customer got no name.
 const clean=s=>s.replace(/\.(html?|aspx|php)$/i,'').replace(/[-_+]/g,' ').replace(/\b\d{4,}\b/g,'').replace(/\s+/g,' ').trim();
 const cands=segs.filter(s=>!STOP.has(s.toLowerCase())&&!/^\d+$/.test(s)).map(clean);
 let slug=cands.reduce((best,s)=>
   ((s.match(/[a-z]/gi)||[]).length > (best.match(/[a-z]/gi)||[]).length ? s : best), '');
 const letters=(slug.match(/[a-z]/gi)||[]).length;
 if(!slug||slug.length<3||letters<5){out.reason='noname';out.ok=true;out.name='';}
 else {out.ok=true;out.name=titleCase(slug)}
 // Size is genuinely readable from most retailer slugs, so we read it.
 // Price is NOT. A browser cannot fetch a retailer page (CORS), and a real
 // implementation needs a server-side scraper per retailer. We never invent
 // a price: an unverified number that looks confirmed is worse than none.
 const sz=slug.match(/(\d+(?:\.\d+)?)\s?(ml|litre|liter|l|g|kg|oz)\b/i);
 if(sz)out.size=sz[1]+sz[2].toLowerCase().replace(/^(litre|liter)$/,'l');
 const pk=slug.match(/(\d+)\s?(pack|pk|piece|pcs|pair)\b/i);
 if(pk&&!out.size)out.size=pk[1]+' '+pk[2].toLowerCase();
 out.price=null;out.wasPrice=null;
 out.availability='To be confirmed';
 if(r&&!r.autoExtract)out.reason='noauto';
 return out;
}

   through a public CORS proxy and parse the retailer's own structured data

   some retailers block them at the edge. Every failure path falls through to
   manual entry, which is what the real service does anyway.                */
const PROXIES=[
 u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u),
 u=>'https://api.codetabs.com/v1/proxy/?quest='+encodeURIComponent(u),

/* Race the relays rather than trying them in turn: a dead one should not
   make the customer wait for a live one. First usable response wins. */
async function fetchHTML(url){
 const attempt=mk=>new Promise((resolve,reject)=>{
  const ctl=new AbortController();
  const timer=setTimeout(()=>{ctl.abort();reject(new Error('timeout'))},3500);
  fetch(mk(url),{signal:ctl.signal,headers:{'Accept':'text/html,*/*'}})
   .then(res=>{
     clearTimeout(timer);
     if(!res.ok)throw new Error('http '+res.status);
     return res.text();
   })
   .then(txt=>{
     if(!txt||txt.length<800)throw new Error('empty');
     if(/pardon our interruption|access denied|are you a robot|<title>\s*just a moment/i.test(txt.slice(0,4000)))throw new Error('bot-blocked');
     resolve(txt);
   })
   .catch(e=>{clearTimeout(timer);reject(e)});
 });
 try{return await Promise.any(PROXIES.map(attempt))}catch(e){return null}
}
function toNum(v){
 if(v==null)return null;
 const n=parseFloat(String(v).replace(/[^0-9.]/g,''));

function flattenLD(node,out){
 if(!node||typeof node!=='object')return;
 if(Array.isArray(node)){node.forEach(n=>flattenLD(n,out));return}
 out.push(node);

function isType(n,t){const x=n&&n['@type'];return x===t||(Array.isArray(x)&&x.includes(t))}

 const meta=sel=>{const el=doc.querySelector(sel);return el?el.getAttribute('content'):null};

 // 1. schema.org Product, what retailers publish for Google Shopping
 const nodes=[];
 doc.querySelectorAll('script[type="application/ld+json"]').forEach(s=>{
  try{flattenLD(JSON.parse(s.textContent),nodes)}catch(e){}
 });
 const prod=nodes.find(n=>isType(n,'Product'));
 if(prod){
  out.name=typeof prod.name==='string'?prod.name:null;
  out.brand=prod.brand&&(prod.brand.name||prod.brand)||null;
  const im=prod.image;
  out.image=Array.isArray(im)?(typeof im[0]==='string'?im[0]:im[0]&&im[0].url):(typeof im==='string'?im:im&&im.url)||null;
  let off=prod.offers;
  if(Array.isArray(off))off=off[0];
  if(off){
   out.price=toNum(off.price!=null?off.price:off.lowPrice);
   if(off.availability)out.availability=/InStock/i.test(off.availability)?'In stock':/OutOfStock|SoldOut/i.test(off.availability)?'Out of stock':null;
  }
 }
 // 2. Open Graph and product meta
 out.name=out.name||meta('meta[property="og:title"]')||meta('meta[name="twitter:title"]');
 out.image=out.image||meta('meta[property="og:image"]')||meta('meta[name="twitter:image"]');
 if(out.price==null)out.price=toNum(meta('meta[property="product:price:amount"]')||meta('meta[property="og:price:amount"]')||meta('meta[itemprop="price"]'));
 out.wasPrice=toNum(meta('meta[property="product:original_price:amount"]'));
 // 3. microdata, last resort
 if(out.price==null){
  const el=doc.querySelector('[itemprop="price"]');
  if(el)out.price=toNum(el.getAttribute('content')||el.textContent);
 }
 if(!out.name){const h1=doc.querySelector('h1');if(h1)out.name=h1.textContent.trim()}
 if(out.name)out.name=out.name.replace(/\s+/g,' ').replace(/\s*[|–-]\s*(Boots|Superdrug|ASOS|LookFantastic|Next|Cult Beauty|Beauty Bay|Space NK)\s*$/i,'').trim();
 if(out.wasPrice&&out.price&&out.wasPrice<=out.price)out.wasPrice=null;
 return out;
}

function applyImport(code){
 let raw;
 try{raw=JSON.parse(decodeURIComponent(escape(atob(code))))}catch(e){return false}
 if(!raw||!raw.u)return false;
 const base=extract(raw.u);
 if(!base.ok)return false;
 const price=raw.p!=null?toNum(raw.p):null;
 const clean=s=>String(s||'').replace(/\s+/g,' ')
   .replace(/\s*[|–-]\s*(Boots|Superdrug|ASOS|LookFantastic|Next|Cult Beauty|Beauty Bay|Space NK)\s*$/i,'').trim();
 const dr=draft();
 dr.pendingUrl=raw.u;
 dr.pending=Object.assign({},base,{
  name:(raw.n&&raw.n.length>3)?clean(raw.n):base.name,
  price,wasPrice:null,image:raw.i||null,

  live:price!=null?'ok':'partial',
  via:raw.s||'page'

 if(!dr.pending.size)dr.pending.size=sizeFrom(dr.pending.name);

/* ---------------- product categories ----------------
   Colour and Shade on a bottle of perfume is noise, and noise is how the
   wrong item gets bought. The options asked for follow the kind of product,
   inferred from the name. Where the guess is not confident the customer
   picks the category themselves rather than being handed the wrong form. */
/* The link already identifies the product. Size is the one thing that
   commonly varies behind a single URL, and for clothing, shoes, wigs and
   makeup there is usually one more choice made on the page. So we ask for
   at most two, and never for options the product cannot have. */
const CATEGORIES=[
 {k:'fragrance',label:'Fragrance',
  match:['eau de parfum','eau de toilette','eau de cologne','parfum','cologne','aftershave','fragrance','body mist',' edt',' edp'],
  size:{label:'Size',ph:'100ml'},second:null},
 {k:'hairpiece',label:'Wig, weave or extensions',
  match:['wig','bundle','closure','frontal','weave','extension','ponytail','braiding hair','crochet','lace front','drawstring','hair piece'],
  size:{label:'Length',ph:'22 inch'},second:{id:'colour',label:'Colour',ph:'1B natural black'}},
 {k:'makeup',label:'Makeup',
  match:['lipstick','lip gloss','lip liner','foundation','concealer','mascara','eyeshadow','eye shadow','blush','bronzer','highlighter','eyeliner','setting powder','primer','palette','brow pencil'],
  size:{label:'Size',ph:'30ml'},second:{id:'shade',label:'Shade',ph:'Biscuit, 4.5N'}},
 {k:'haircare',label:'Hair care',
  match:['shampoo','conditioner','hair oil','hair mask','relaxer','edge control','leave-in','leave in','hair food','curl cream','detangler','hair spray','hair gel','co-wash',
   'hair perfector','bond builder','hair treatment','hair repair','hair colour','hair dye','developer','bleach'],
  size:{label:'Size',ph:'400ml'},second:null},
 {k:'skincare',label:'Skin and body care',
  match:['serum','moisturis','cleanser','toner','sunscreen','spf','body butter','cocoa butter','shea butter','balm','scrub','shower gel','deodorant','body wash','face wash','micellar','exfoliant','cream','lotion','soap','oil',
   'niacinamide','hyaluronic','retinol','vitamin c','salicylic','glycolic','azelaic','squalane','peptide','ceramide','ampoule','essence'],
  size:{label:'Size',ph:'250ml'},second:null},
 {k:'footwear',label:'Shoes',
  match:['trainer','sneaker','shoe','boot','sandal','heel','loafer','air force','air max','slider','flip flop'],
  size:{label:'UK size',ph:'UK 8'},second:{id:'colour',label:'Colour',ph:'White'}},
 {k:'clothing',label:'Clothing',
  match:['dress','jeans','shirt','hoodie','jacket','t-shirt','tshirt','trouser','skirt','coat','jumper','blazer','legging','tracksuit'],
  size:{label:'Size',ph:'UK 12'},second:{id:'colour',label:'Colour',ph:'Black'}},
 {k:'other',label:'Something else',match:[],
  size:{label:'Size',ph:''},second:{id:'colour',label:'Colour or option',ph:''}}
];
function catFieldList(k){
 const c=catOf(k), out=[Object.assign({id:'size'},c.size)];
 if(c.second)out.push(c.second);
 return out;
}
function catOf(k){return CATEGORIES.find(c=>c.k===k)||CATEGORIES[CATEGORIES.length-1]}
/* Detect from the product name only, never the URL: boots.com contains
   "boot", which would turn every unmatched Boots product into a shoe. The
   retailer name is stripped for the same reason. */
function detectCategory(name,retailerName){
 let t=' '+String(name||'').toLowerCase().replace(/[^a-z0-9%+ ]+/g,' ').replace(/\s+/g,' ')+' ';
 if(retailerName)t=t.split(String(retailerName).toLowerCase()).join(' ');
 for(const c of CATEGORIES){
  if(c.match.some(m=>t.includes(m)))return {k:c.k,confident:true};
 }
 return {k:'other',confident:false};
}
/* One phrasing for the substitution instruction, used everywhere it shows. */
function subsText(it,forAdmin){
 if(it.subsAllowed==='cancel')return 'Cancel and refund if unavailable';
 if(it.subsAllowed==='link'||it.subsAllowed==='yes'){
  const bits=[];
  if(it.subsSize)bits.push(it.subsSize);
  if(it.subsPrice!=null)bits.push('up to '+money(it.subsPrice));
  if(it.subsNotes)bits.push(it.subsNotes);
  const tail=bits.length?' ('+bits.join(', ')+')':'';
  if(it.subsUrl)return (forAdmin?'Backup approved: ':'Backup product given')+(forAdmin?`<a class="link" href="${esc(it.subsUrl)}" target="_blank" rel="noopener">open link</a>`:'')+tail;
  return 'Substitute acceptable'+tail;
 }
 return forAdmin?'Do not substitute, ask the customer first':'Ask me first';
}
function attrText(it){
 const parts=catFieldList(it.category).map(f=>it.attrs&&it.attrs[f.id]).filter(Boolean);
 if(it.attrs&&it.attrs.other)parts.push(it.attrs.other);
 return parts.join(' · ');
}

async function enrich(p){
 const html=await fetchHTML(p.url);
 if(!html)return {...p,live:'failed'};
 const d=parseProduct(html);
 const merged={...p,live:(d.price!=null||d.name)?'ok':'partial'};
 if(d.name&&d.name.length>3)merged.name=d.name;
 if(d.price!=null)merged.price=d.price;

}

/* ---------------- pricing ---------------- */
function itemPrice(it){const p=(it.confirmedPrice!=null&&it.confirmedPrice!=='')?Number(it.confirmedPrice):Number(it.displayedPrice||0);return round2(p)}
function itemLine(it){return round2(itemPrice(it)*(Number(it.qty)||1))}
/* If someone reported one price and the shop is charging another, say so on the
   quote. Finding out by arithmetic is how a fair price starts an argument. */
function priceMoved(it){
 const said=it.displayedPrice, now=it.confirmedPrice;
 if(said==null||said===''||now==null||now==='')return '';
 const d=round2(Number(now)-Number(said));
 if(Math.abs(d)<0.01)return '';
 return `<div class="tiny" style="color:var(--ochre)">${icon('alert',11)} You told us ${money(said)}. The shop is charging ${money(now)} today, ${d>0?money(d)+' more':money(-d)+' less'}, so we have quoted the price we can actually buy it at.</div>`;
}
function activeItems(o){return o.items.filter(i=>i.itemStatus!=='Removed'&&i.itemStatus!=='Refunded')}
/* Once the shipment leaves the UK the goods are gone and the freight is spent,
   so that is the hard edge for cancelling. */
function hasSailed(o){return (JOURNEY_RANK[o.status]||0)>=6}
/* Cancelling an item before departure. The shop decides whether it will take
   the thing back at all; we only decide what comes off the money.

   Shipping is deliberately NOT refunded on a partial cancellation. The parcel
   still sails, just lighter, and the weigh-in already refunds the difference,
   so paying it back here would pay it back twice. On a full cancellation no
   parcel is ever weighed, so nothing else would ever return it. */
/* Draft a complete quote from what we already know: the customer's reported
   price, the retailer's recorded postage, the box the goods fit into. It is a
   proposal, not a promise, and it is only ever sent by a human pressing
   approve. Anything that genuinely needs a person, a restricted item or a shop
   whose postage we have never recorded, blocks it and says why. */
function autoQuote(o){
 const st=S.settings;
 if(o.items.some(i=>i.restricted.length&&!i.restrictedCleared))return {ok:false,why:'a restricted item needs clearing'};
 if(activeItems(o).some(i=>i.displayedPrice==null&&i.confirmedPrice==null))return {ok:false,why:'an item has no price on it'};
 const q=quoteCalc(o);
 if(q.deliveryUnknown)return {ok:false,why:'we have never bought from one of these shops, so their postage is unknown'};
 o.quote=Object.assign({id:uid('q'),deliveryOverrides:{},adjustments:[],sentAt:null,expiresAt:null,
   expiryMins:st.quoteExpiryMins,status:'Draft',auto:true},o.quote||{});
 o.quote.auto=true; o.quote.sentAt=null;
 setStatus(o,'Quote ready','Priced automatically, awaiting approval');
 logAudit(o.ref,'Quote drafted automatically','',money(quoteCalc(o).total));
 return {ok:true};
}
function refundCalc(o,it,retailerHeld){
 const st=S.settings;
 const product=itemLine(it);
 const held=round2(Math.max(0,Number(retailerHeld)||0));
 const admin=round2(Math.max(product*(st.returnAdminPct||0)/100,st.returnAdminMin||0));
 const last=activeItems(o).length<=1;
 const shipping=last?round2(quoteCalc(o).cargoEst):0;
 return {product,held,admin,shipping,lastItem:last,sailed:hasSailed(o),
         fee:round2(quoteCalc(o).fee),
         refund:round2(Math.max(0,product-held-admin+shipping))};
}
function quoteCalc(o){
 const st=S.settings, items=activeItems(o);
 const groups={};
 items.forEach(it=>{const k=it.retailerId||('other:'+(it.retailerName||'Unknown'));
   if(!groups[k])groups[k]={key:k,retailerId:it.retailerId,name:it.retailerName||'Unknown retailer',items:[],subtotal:0,delivery:0,freeApplied:false};
   groups[k].items.push(it);groups[k].subtotal=round2(groups[k].subtotal+itemLine(it));});
 const list=Object.values(groups);
 list.forEach(g=>{
   const r=g.retailerId?retailerById(g.retailerId):null;
   const override=o.quote&&o.quote.deliveryOverrides?o.quote.deliveryOverrides[g.key]:undefined;
   if(override!==undefined&&override!==''&&override!==null){g.delivery=round2(Number(override)||0);g.manual=true;}
   else if(r){ if(r.freeOver&&g.subtotal>=r.freeOver){g.delivery=0;g.freeApplied=true} else g.delivery=round2(r.delivery||0) }
   else g.delivery=0;
 });
 const productTotal=round2(list.reduce((a,g)=>a+g.subtotal,0));
 const deliveryTotal=round2(list.reduce((a,g)=>a+g.delivery,0));
 // A shop we have no record of has no known postage. Zero is a lie; say so.
 const deliveryUnknown=list.some(g=>!g.retailerId&&!g.manual);
 let fee;
 if(st.feeBasis==='per-retailer'){fee=round2(list.reduce((a,g)=>a+Math.max(g.subtotal*st.procurementPct/100,st.procurementMin),0))}
 else {fee=round2(Math.max(productTotal*st.procurementPct/100,st.procurementMin))}
 const adjustments=(o.quote&&o.quote.adjustments)||[];
 const adjTotal=round2(adjustments.reduce((a,x)=>a+Number(x.delta||0),0));
 // Zimbabwe shipping is quoted up front, estimated from the products, so
 // the customer settles everything in one payment. If the scales disagree
 // later we ask for the difference or refund it.
 const mode=o.shipMode||'sea';
 const cargoAuto=estimateCargo({items,shipMode:mode});
 const cargoEst=(o.quote&&o.quote.cargoEstimate!=null&&o.quote.cargoEstimate!=='')?round2(Number(o.quote.cargoEstimate)):cargoAuto.amount;
 const total=round2(productTotal+deliveryTotal+fee+adjTotal+cargoEst);
 // Expensive orders are advised to fly: nothing is insured, so the argument is
 // less time and fewer hands, not speed. Cheap and bulky orders are advised to
 // fly too, because it simply costs less.
 const adviseAir=mode!=='air'&&(productTotal>=st.adviseAirOver||cargoAuto.cheaper==='air');
 return {groups:list,productTotal,deliveryTotal,deliveryUnknown,fee,adjTotal,adjustments,cargoEst,
  mode,cargoKg:cargoAuto.kg,cargoL:cargoAuto.litres,cargoAuto:cargoAuto.amount,
  cargoRate:cargoAuto.rate,cargoMin:cargoAuto.min,cargoFreight:cargoAuto.freight,cargoClearance:cargoAuto.clearance,
  sea:cargoAuto.sea,air:cargoAuto.air,cheaper:cargoAuto.cheaper,saving:cargoAuto.saving,adviseAir,
  seaTier:cargoAuto.sea.tier,seaHeadroom:cargoAuto.sea.headroom,
  boxShare:cargoAuto.sea.boxShare,
  total,meetsMin:productTotal>=st.minSpend,shortfall:round2(Math.max(0,st.minSpend-productTotal))};
}
function cargoCalc(o){
 const st=S.settings, c=o.cargo||{};
 const mode=o.shipMode||'sea';
 const actual=Number(c.actualWeight)||0;
 const pack=c.packaging!=null&&c.packaging!==''?Number(c.packaging):(st.packagingKg||0);
 const clearance=c.clearance!=null&&c.clearance!==''?Number(c.clearance):st.clearance;
 const local=c.localDelivery!=null&&c.localDelivery!==''?Number(c.localDelivery):st.localDelivery;
 const other=Number(c.other)||0;
 // Measured litres from the packed carton. Sea is charged on the space it takes
 // in the box, so this is the number that matters, not the scales.
 const litres=(c.l&&c.w&&c.h)?round2((Number(c.l)*Number(c.w)*Number(c.h))/1000):(Number(c.litres)||0);
 let freight,rate,basis,chargeable;
 if(mode==='air'){
  // Air still charges volumetric weight when a parcel is bulky and light.
  const vol=(c.l&&c.w&&c.h)?round2((Number(c.l)*Number(c.w)*Number(c.h))/(st.volDivisor||5000)):0;
  chargeable=round2(Math.max(actual+pack,vol));
  rate=c.rate!=null&&c.rate!==''?Number(c.rate):st.airRate;
  freight=round2(Math.max(chargeable*rate,st.airMin));
  basis=chargeable+' kg chargeable';
 } else {
  chargeable=litres;
  rate=c.rate!=null&&c.rate!==''?Number(c.rate):seaRateGross();
  freight=round2(Math.max(litres*rate,st.seaMin));
  basis=litres+' litres, '+round2(litres/usableLitres()*100)+'% of a box';
 }
 const total=round2(freight+clearance+local+other);
 return {mode,actual,litres,pack,chargeable,rate,basis,freight,clearance,local,other,total,
         boxShare:round2(litres/usableLitres()*100)};
}
/* Shipping is quoted up front so the customer pays once, so the weight
   guess has to be honest. Volume from the size where we have it, a
   sensible default per product kind where we do not, plus packaging. */
const CAT_KG={fragrance:0.35,makeup:0.12,hairpiece:0.30,footwear:1.10,clothing:0.35,haircare:0.30,skincare:0.30,other:0.40};
/* Packed volume in litres, retail box included, because sea freight charges for
   the space a thing occupies and not what it weighs. These are the numbers the
   whole sea price rests on, so they are worth arguing with. */
const CAT_L={fragrance:0.55,makeup:0.45,hairpiece:4.80,footwear:8.70,clothing:3.50,haircare:1.10,skincare:0.60,other:2.00};
function boxLitres(){const st=S.settings;return round2(st.seaBoxMmL*st.seaBoxMmW*st.seaBoxMmH/1e6)}
function usableLitres(){return round2(boxLitres()*(S.settings.packEfficiencyPct||75)/100)}
/* Two rates, and they are not a markup on each other.
   Quoting works from the sum of item volumes, which is the space the goods
   themselves occupy, so it uses the USABLE litres of a box: the void between
   things is already priced into that smaller denominator.
   Reconciling works from the outer carton we actually pack, which already
   contains the void, so it uses the GROSS litres. Charge the carton at the
   usable rate and the customer pays for the same empty space twice. */
function seaRate(){return round2(S.settings.seaBoxPrice/usableLitres())}
function seaRateGross(){return round2(S.settings.seaBoxPrice/boxLitres())}
/* Pick the smallest box the goods actually go in. Boxes are not filled to the
   brim, so allow for the gaps: rigid things leave voids and soft things only
   compress so far. Past the biggest box it is whole boxes plus one for the
   remainder, because that is literally what gets packed and labelled. */
function boxCapacityL(b){
 const st=S.settings, i=b.mm.map(x=>x-6);
 return round2(i[0]*i[1]*i[2]/1e6*(st.boxFillPct||80)/100);
}
function seaBoxFor(litres){
 const st=S.settings, boxes=(st.seaBoxes||[]).slice().sort((a,b)=>a.cells-b.cells);
 if(!boxes.length)return {name:'Box',price:st.seaBoxPrice,cells:8,count:1,capacity:0,headroom:0};
 const big=boxes[boxes.length-1], bigCap=boxCapacityL(big);
 const whole=Math.floor(litres/bigCap);
 const rest=round2(litres-whole*bigCap);
 const b=boxes.find(x=>rest<=boxCapacityL(x));
 if(!b)return {name:(whole+1)+' Full boxes',price:round2((whole+1)*big.price),cells:(whole+1)*big.cells,count:whole+1,capacity:round2((whole+1)*bigCap),headroom:0,box:big};
 const price=round2(whole*big.price+(rest>0?b.price:0));
 const cells=whole*big.cells+(rest>0?b.cells:0);
 const name=whole?(whole+' Full box'+(whole>1?'es':'')+(rest>0?' plus a '+b.name:'')):b.name;
 return {name,price,cells,count:whole+(rest>0?1:0),box:rest>0?b:big,
         capacity:round2(whole*bigCap+(rest>0?boxCapacityL(b):0)),
         headroom:round2((rest>0?boxCapacityL(b):bigCap)-rest)};
}
/* What one sailing is worth against what it costs. This is the number that
   decides whether a box should go at all. */
function boxEconomics(orders){
 const st=S.settings, per=st.cellsPerArchiveBox||8;
 let cells=0,revenue=0,n=0,litres=0;
 (orders||[]).forEach(o=>{
  if((o.shipMode||'sea')!=='sea')return;
  const q=quoteCalc(o);
  cells+=q.sea?q.sea.cells:0; revenue+=q.cargoFreight||0; litres+=q.cargoL||0; n++;
 });
 revenue=round2(revenue); litres=round2(litres);
 const boxes=Math.max(1,Math.ceil(cells/per));
 const cost=round2(boxes*st.seaBoxPrice);
 return {orders:n,cells,litres,revenue,boxes,cost,margin:round2(revenue-cost),
         capacity:boxes*per, fillPct:round2(cells/(boxes*per)*100),
         pays:revenue>=cost,
         // the number worth knowing on the 14th of the month
         needCells:Math.max(0,Math.ceil((cost-revenue)/((st.seaBoxes&&st.seaBoxes[0].price)||22)))};
}
function estimateItemL(it){
 if(it.estL!=null&&it.estLManual)return Number(it.estL);
 const l=CAT_L[it.category]; return round2(l!=null?l:CAT_L.other);
}
function estimateItemKg(it){
 if(it.estKg!=null&&it.estKgManual)return Number(it.estKg);
 const size=(it.attrs&&it.attrs.size)||'';
 const m=String(size).match(/(\d+(?:\.\d+)?)\s*(ml|kg|g|l)\b/i);
 let kg=null;
 if(m){
  const n=parseFloat(m[1]), u=m[2].toLowerCase();
  if(u==='ml')kg=n/1000; else if(u==='l')kg=n; else if(u==='g')kg=n/1000; else kg=n;
  // contents plus the bottle or jar around them, glass being the heavy case
  kg=kg*1.15+(it.category==='fragrance'?0.25:0.06);
 } else kg=CAT_KG[it.category]!=null?CAT_KG[it.category]:0.4;
 return round2(Math.max(0.05,kg));
}
/* Prices BOTH routes for the same goods, because which one is cheaper is not
   obvious and depends on density, not on price or size alone. Sea charges for
   the space, air charges for the weight, and they cross over at about
   237 kg/m3: cosmetics and liquids go by sea, anything bulky and light goes by
   air for less money and two months less waiting. The customer sees both. */
function estimateCargo(o,mode){
 const st=S.settings;
 const items=activeItems(o);
 // The safety margin goes on freight only. Clearance is money we hand straight
 // to the carrier, so quoting a padded figure and still calling it clearance is
 // the one line that would not survive a customer seeing a carrier invoice.
 const m=1+(st.cargoSafetyPct||0)/100;
 const clearance=round2((st.clearance||0)+(st.localDelivery||0));
 const kg=round2(items.reduce((a,i)=>a+estimateItemKg(i)*(Number(i.qty)||1),0)+(st.packagingKg||0));
 const litres=round2(items.reduce((a,i)=>a+estimateItemL(i)*(Number(i.qty)||1),0));

 const seaRateM=round2(seaRate()*m), seaMinM=round2((st.seaMin||0)*m);
 // Sea is a standard size, so the price is the size's price. The margin is
 // already inside the published sizes; padding them again would double it.
 const tier=seaBoxFor(litres);
 const seaFreight=round2(tier.price);
 const airRateM=round2((st.airRate||0)*m), airMinM=round2((st.airMin||0)*m);
 const airFreight=round2(Math.max(kg*airRateM,airMinM));

 const sea={mode:'sea',kg,litres,rate:seaRateM,min:seaMinM,freight:seaFreight,clearance,
            amount:round2(seaFreight+clearance),boxShare:round2(litres/usableLitres()*100),
            tier:tier.name,tierMaxL:tier.capacity,headroom:tier.headroom,boxes:tier.count,cells:tier.cells};
 const air={mode:'air',kg,litres,rate:airRateM,min:airMinM,freight:airFreight,clearance,
            amount:round2(airFreight+clearance)};
 const chosen=(mode||o.shipMode||'sea')==='air'?air:sea;
 return Object.assign({},chosen,{sea,air,
   cheaper:air.amount<sea.amount?'air':'sea',
   saving:round2(Math.abs(air.amount-sea.amount))});
}
/* ---------------- shipping cycle ----------------
   Stock moves on a fixed six-week cycle, so the useful question is not
   "how long does it take" but "which shipment am I on, and by when do I have
   to pay to be on it". Everything is derived from one anchor date. */
const DAY=86400000;
function shipSchedule(count){
 const st=S.settings, now=Date.now();
 const day=n=>Math.min(Math.max(Number(n)||1,1),28);
 const hand=day(st.handoverDay), goods=day(st.goodsByDay), order=day(st.orderByDay);
 const at=(y,m,d)=>new Date(y,m,d,12,0,0).getTime();
 const d0=new Date(now);
 const out=[];
 // Sea sails once a calendar month, so the schedule is months, not an interval.
 for(let i=0,m=d0.getMonth(),y=d0.getFullYear();out.length<(count||1);i++){
  const mm=m+i, yy=y+Math.floor(mm/12), mo=((mm%12)+12)%12;
  const departs=at(yy,mo,hand), cutoff=at(yy,mo,order), goodsBy=at(yy,mo,goods);
  if(cutoff<now-DAY)continue;                  // that boat has gone
  out.push({
   departs,cutoff,goodsBy,
   daysAway:Math.max(0,Math.ceil((departs-now)/DAY)),
   cutoffDays:Math.ceil((cutoff-now)/DAY),
   cutoffPassed:now>cutoff,
   arrives:departs+(Number(st.seaTransitMinDays)||42)*DAY,
   arrivesLate:departs+(Number(st.seaTransitMaxDays)||49)*DAY
  });
 }
 return out;
}
/* Air does not wait for a boat. It leaves once the goods are with us and
   checked, so the only lead time is the retailer's own delivery. */
function airEta(){
 const st=S.settings;
 return {min:Date.now()+(3+(Number(st.airTransitMinDays)||5))*DAY,
         max:Date.now()+(3+(Number(st.airTransitMaxDays)||7))*DAY,
         minDays:Number(st.airTransitMinDays)||5, maxDays:Number(st.airTransitMaxDays)||7};
}
function nextShipment(){
 // If the cutoff for the next shipment has passed, the honest answer is the one after.
 const s=shipSchedule(3);
 return s.find(x=>!x.cutoffPassed)||s[0];
}
function fmtDay(ts){return new Date(ts).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}

function payTotals(o){
 const paid=o.payments.filter(p=>['Payment completed','Payment available','Payment held'].includes(p.status));
 const initialPaid=paid.filter(p=>p.type!=='cargo').reduce((a,p)=>a+p.amount,0);
 const cargoPaid=paid.filter(p=>p.type==='cargo').reduce((a,p)=>a+p.amount,0);
 const refunded=(o.refunds||[]).reduce((a,r)=>a+Number(r.amount||0),0);
 return {initialPaid:round2(initialPaid),cargoPaid:round2(cargoPaid),refunded:round2(refunded),net:round2(initialPaid+cargoPaid-refunded)};
}
function margin(o){
 const t=payTotals(o);
 const cost=activeItems(o).reduce((a,i)=>a+((i.purchase&&i.purchase.actualCost!=null)?Number(i.purchase.actualCost):itemLine(i)),0);
 const del=activeItems(o).reduce((a,i)=>a+((i.purchase&&i.purchase.actualDelivery!=null)?Number(i.purchase.actualDelivery):0),0);
 const q=quoteCalc(o);
 const ukDel=del||q.deliveryTotal;
 return round2(t.net-cost-ukDel-(o.cargo&&o.cargo.paidOut?Number(o.cargo.paidOut):0));
}
function quoteExpired(o){return !!(o.quote&&o.quote.sentAt&&o.quote.expiresAt&&Date.now()>o.quote.expiresAt&&!payTotals(o).initialPaid)}

function route(){

 const parts=path.split('/').filter(Boolean);
 const q={};(qs||'').split('&').filter(Boolean).forEach(kv=>{const [k,v]=kv.split('=');q[decodeURIComponent(k)]=decodeURIComponent(v||'')});
 return {parts,q};
}
function render(){

  const ok=q.d?applyImport(q.d):false;
  location.hash='#/request';
  setTimeout(()=>toast(ok?'Imported from the retailer page':'That import link was not readable'),60);
  return;
 }
 const isAdmin=parts[0]==='admin';
 let body='';

  if(!parts.length)body=viewHome();
  else if(parts[0]==='request')body=viewRequest();
  else if(parts[0]==='submitted')body=viewSubmitted(parts[1]);
  else if(parts[0]==='track')body=viewTrack(parts[1],parts[2]);
  else if(parts[0]==='quote')body=viewQuote(parts[1],parts[2]);
  else if(parts[0]==='pay')body=viewPay(parts[1],parts[2],parts[3]);
  else if(parts[0]==='lookup')body=viewLookup();
  else if(isAdmin)body=(S.session==='admin')?viewAdmin(parts.slice(1),q):lockedPanel();
  else body=`<div class="narrow"><div class="empty">Page not found. <a class="link" href="#/">Go back</a></div></div>`;
 }catch(e){body=`<div class="narrow">${note('<b>Something went wrong rendering this page.</b><br>'+esc(e.message),'danger','alert')}</div>`;console.error(e)}
 $('#app').innerHTML=shell(body,isAdmin);
 // The shelf only exists on the landing page, so it starts and stops with it
 // rather than ticking away behind every other route.

 window.scrollTo(0,VIEW.keepScroll?window.scrollY:0);VIEW.keepScroll=false;
}

/* ---------------- "any UK shop", demonstrated ----------------
   An address bar types out a real product link, from a different shop each
   time, and confirms it. Whether a shop counts as known is read from the
   retailer list, so adding John Lewis there flips its verdict here. */
const LINK_SAMPLES=[
 {host:'boots.com',           path:'/no7-protect-and-perfect-serum-50ml'},
 {host:'asos.com',            path:'/nike/air-force-1-white/prd/203991884'},
 {host:'johnlewis.com',       path:'/charlotte-tilbury-pillow-talk-lipstick'},
 {host:'cultbeauty.co.uk',    path:'/p/the-ordinary-niacinamide-10-zinc-1'},
 {host:'marksandspencer.com', path:'/pure-cotton-shirt/p/clp60123456'},
 {host:'superdrug.com',       path:'/palmers-cocoa-butter-formula-400ml'}
];
const TICK_SVG='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 12.5 9.5 17.5 19.5 6.5"/></svg>';
let linkTimers=[],linkIdx=0,linkRun=0;
function stopLinkbar(){linkTimers.forEach(clearTimeout);linkTimers=[];linkRun++}
function knownShop(host){return S.retailers.some(r=>r.domains.some(d=>host===d||host.endsWith('.'+d)))}
function paintUrl(s,upto){
 const el=document.getElementById('linkUrl'); if(!el)return;
 const full='https://www.'+s.host+s.path, hostEnd=('https://www.'+s.host).length;
 el.innerHTML = upto<=hostEnd
  ? `<span class="host">${esc(full.slice(0,upto))}</span>`
  : `<span class="host">${esc(full.slice(0,hostEnd))}</span><span class="path">${esc(full.slice(hostEnd,upto))}</span>`;
}
function runLinkbar(){
 const url=document.getElementById('linkUrl'), verdict=document.getElementById('linkVerdict');
 if(!url||!verdict){stopLinkbar();return}
 const me=linkRun;                                  // an older cycle must never paint
 const s=LINK_SAMPLES[linkIdx%LINK_SAMPLES.length];
 const known=knownShop(s.host);
 const full='https://www.'+s.host+s.path;
 const say=()=>{verdict.className='linkbar-verdict on'+(known?'':' fresh');
   verdict.innerHTML=TICK_SVG+(known?`<span>We buy from ${esc(s.host)} all the time</span>`
                                    :`<span>New shop to us. Still yes, we confirm their postage</span>`)};
 verdict.className='linkbar-verdict';verdict.innerHTML='';
 if(matchMedia('(prefers-reduced-motion: reduce)').matches){
  paintUrl(s,full.length);say();linkIdx++;
  linkTimers.push(setTimeout(runLinkbar,3400));return;
 }
 let n=12+s.host.length;                            // the domain is already there
 paintUrl(s,n);
 const step=()=>{
  if(me!==linkRun)return;
  n+=2;paintUrl(s,Math.min(n,full.length));
  if(n<full.length)linkTimers.push(setTimeout(step,22));
  else{
   linkTimers.push(setTimeout(()=>{if(me===linkRun)say()},260));
   linkTimers.push(setTimeout(()=>{if(me!==linkRun)return;linkIdx++;runLinkbar()},3000));
  }
 };
 linkTimers.push(setTimeout(step,420));
}

function choosePick(nth){

 lastPickIndex=p.i;
 const ptag=document.getElementById('heroPtag'), dest=document.getElementById('heroDest');

 // row 0 sits one tile above centre, row 2 one tile below

function collectAttrs(catKey){
 const out={};
 catFieldList(catKey).forEach(f=>{const v=val('pa_'+f.id);if(v)out[f.id]=v});
 const other=val('pa_other'); if(other)out.other=other;
 return out;
}
function addPending(){
    const dr=draft(),p=dr.pending;if(!p)return false;
    const name=val('pName');
    if(!name){toast('Please give the product a name so we buy the right thing');return false}
    const it=newItem({url:p.url,retailerId:p.retailerId,retailerName:p.retailerName,name,
      category:val('pCat')||detectCategory(name,p.retailerName).k,
      attrs:collectAttrs(val('pCat')||detectCategory(name,p.retailerName).k),
      qty:Math.max(1,Number(val('pQty'))||1),
      displayedPrice:val('pPrice')===''?null:round2(Number(val('pPrice'))),
      priceSource:val('pPrice')===''?'':(p.price!=null&&round2(Number(val('pPrice')))===p.price?srcLabel(p.via||'live'):'Customer reported'),
      wasPrice:p.wasPrice||null,image:p.image||null,availability:p.availability,
      extractOk:p.live==='ok',subsAllowed:val('pSubs')||'no',
      subsUrl:val('pSubsUrl'),subsSize:val('pSubsSize'),subsPrice:val('pSubsPrice')===''?null:round2(Number(val('pSubsPrice'))),
      customerNotes:val('pNotes'),
      cancelIfUnavailable:val('pSubs')==='cancel'});
    it.restricted=restrictedHits([name,it.url,it.customerNotes].join(' '));
    dr.items.push(it);dr.pending=null;dr.pendingUrl='';save();rerender(true);
    toast(it.restricted.length?'Added. This item needs a manual check before we can quote.':'Added to your request');
    return true;
}

/* The total follows you down the form. Once someone is filling in address
   fields the summary has scrolled away, which is exactly when they want to
   check what they are committing to. */
function payBar(d){
 const q=quoteCalc({items:d.items,quote:null,shipMode:d.shipMode||'sea'});
 const priced=d.items.filter(i=>i.displayedPrice!=null).length;
 const nMissing=d.items.length-priced;
 let sub=d.items.length+' item'+(d.items.length===1?'':'s');
 let warn=false;
 if(nMissing){sub+=', '+nMissing+' still '+(nMissing===1?'needs':'need')+' a price';warn=true}
 else if(!q.meetsMin){sub+=' · '+money(q.shortfall)+' under the '+money(S.settings.minSpend)+' minimum';warn=true}
 else sub+=' · shipping included';
 return `<div class="paybar"><div class="paybar-in">
   <div>
     <div class="lbl">Total, paid once</div>
     <div class="amt">${priced?(q.deliveryUnknown?'from ':'')+money(q.total):'—'}</div>
     <div class="sub ${warn?'warn':''}">${esc(sub)}</div>
   </div>
   <span class="grow"></span>
   <button class="btn btn-primary" data-act="submitRequest">${icon('arrow',16)}Send for a price</button>
 </div></div>`;
}

/* What they will actually pay now, shown while they build the request
   rather than sprung on them at the quote. Product + 20% + UK delivery. */
/* Two real routes with a real trade-off, so the customer picks with both
   numbers in front of them rather than being told. Sea charges for space and
   air for weight, so which is cheaper depends on density: a wig flies for less
   than it sails. */
function shipChooser(d,q){
 const st=S.settings, mode=d.shipMode||'sea';
 const n=nextShipment();
 const opt=(key,label,price,when,why)=>`
   <button class="ship-opt ${mode===key?'on':''}" data-act="pickShip" data-v="${key}">
     <span class="so-h"><b>${label}</b><b class="mono">${money(price)}</b></span>
     <span class="so-w">${when}</span>
     <span class="so-y">${why}</span>
   </button>`;
 const cheaper=q.cheaper, saving=q.saving;
 return `<div class="stack-s">
  <div class="tiny muted" style="letter-spacing:.06em;text-transform:uppercase">How it travels</div>
  <div class="ship-opts">
   ${opt('sea','Sea',q.sea.amount,`Order by ${fmtDay(n.cutoff)}, collect around ${fmtDay(n.arrives)}`,
        `${esc(q.sea.tier)}, up to ${q.sea.tierMaxL} litres`)}
   ${opt('air','Air',q.air.amount,`${st.airTransitMinDays} to ${st.airTransitMaxDays} days once we have it`,
        `${q.air.kg} kg by weight`)}
  </div>
  ${cheaper==='air'&&mode!=='air'
    ? note(`<b>Air is ${money(saving)} cheaper here, and weeks faster.</b> Sea charges for the space your order takes up, and yours is bulky for its weight, so flying it costs less than sailing it.`,'accent','plane')
    : ''}
  ${q.productTotal>=st.adviseAirOver&&mode!=='air'
    ? note(`<b>We would send this by air.</b> Nothing we ship can be insured, because cover is not available for consumer goods going into Zimbabwe. So on an order this size the argument is time and handling: air spends ${st.airTransitMinDays} to ${st.airTransitMaxDays} days in the system instead of ${Math.round(st.seaTransitMinDays/7)} to ${Math.round(st.seaTransitMaxDays/7)} weeks, through fewer hands. It is your call.`,'warn','shield')
    : ''}
  <div class="row tiny muted" style="gap:6px;align-items:center">${icon('search',12)}<span>Both routes are tracked, and your order page updates at every stage.</span></div>
 </div>`;
}
function runningTotal(d){

 if(!priced.length)return `<div class="note n-mute" style="margin-top:4px">${icon('pound',15)}<div>Add the price shown on each page and we will total it up for you here, including our fee and UK delivery.</div></div>`;
 const q=quoteCalc({items:d.items,quote:null,shipMode:d.shipMode||'sea'});
 const missing=d.items.length-priced.length;
 return `<div class="stack-s" style="border-top:1px solid var(--line);padding-top:12px">
  <div class="sum">
    <div class="l"><span>Product value${missing?` <span class="tiny muted">(${missing} item${missing>1?'s':''} still need a price)</span>`:''}</span><span class="v">${money(q.productTotal)}</span></div>
    <div class="l"><span>UK delivery${q.groups.length>1?` <span class="tiny muted">${q.groups.length} shops, charged separately</span>`:''}</span><span class="v">${q.deliveryUnknown?'we confirm':money(q.deliveryTotal)}</span></div>

    <div class="l"><span>Zimbabwe shipping <span class="tiny muted">${q.mode==='air'?'by air, about '+q.cargoKg+' kg':'by sea, '+esc(q.seaTier).toLowerCase()+' size'}</span></span><span class="v">${money(q.cargoEst)}</span></div>
    <div class="l total"><span>Total, paid once</span><span class="v">${q.deliveryUnknown?'from ':''}${money(q.total)}</span></div>

    : `<div class="tiny" style="color:var(--accent)">${icon('check',12)} Meets the ${money(st.minSpend)} minimum.</div>`}
  ${q.deliveryUnknown?'<div class=\"tiny\" style=\"color:var(--warn)\">We have not bought from one of these shops before, so we do not know their UK postage yet. We confirm it with them and show it on your quote before you pay.</div>':''}
  ${shipChooser(d,q)}
  <div class="tiny muted">One payment covers everything, including getting it to Zimbabwe. Shipping is worked out from the products, so it is close but not final until the parcel is measured. We quote it slightly high on purpose, and refund whatever is left. If it measures larger we tell you before it ships. We check every price against the shop before you pay anything.</div>
 </div>`;
}

function customerStatusLine(o){
 const t=payTotals(o), q=o.quote?quoteCalc(o):null;
 if(quoteExpired(o))return {tone:'danger',ic:'clock',text:'Your quote has expired. Ask us for an updated one and we will recheck the prices.',cta:null};
 if(/Restricted|Manual review/i.test(o.status))return {tone:'warn',ic:'alert',text:'One of your items needs a closer look before we can quote. We will come back to you.',cta:null};
 if(o.status==='Quote sent'||o.status==='Awaiting initial payment')return {tone:'accent',ic:'card',text:'Your quote is ready. Review it and pay to start the purchase.',cta:{label:'View and pay quote',href:`#/quote/${o.ref}/${o.token}`}};
 if(o.status==='Zimbabwe shipping payment required'||o.status==='Cargo payment pending')return {tone:'ochre',ic:'scale',text:'Your parcel came in heavier than we estimated, so there is a small shipping difference to settle before it ships.',cta:{label:'Pay the difference',href:`#/pay/${o.ref}/${o.token}/cargo`}};
 if(o.status==='Additional payment required')return {tone:'warn',ic:'pound',text:'The retailer price changed. We need your decision before we buy.',cta:{label:'See what changed',href:`#/pay/${o.ref}/${o.token}/additional`}};
 if(o.status==='Substitute approval required')return {tone:'warn',ic:'alert',text:'An item is unavailable. We have suggested an alternative and need your approval.',cta:null};
 if(o.status==='Delivered')return {tone:'accent',ic:'check',text:'Delivered. Thank you for using Tenga.',cta:null};
 // The whole Zimbabwe leg used to fall past this point to the "your quote is on
 // its way" default, which is the wrong thing to tell someone whose parcel has
 // already landed. Each stage says where the parcel actually is.
 if(o.status==='Ready for collection')return {tone:'accent',ic:'pin',text:'Your order is in Harare and ready to collect. Whoever collects needs ID matching the recipient name.',cta:{label:'Where to collect',href:'collection/'}};
 if(o.status==='Out for delivery')return {tone:'ochre',ic:'truck',text:'Out for delivery in Harare today.',cta:null};
 if(/Arrived in Zimbabwe|Customs clearance/i.test(o.status))return {tone:'ochre',ic:'plane',text:'Landed in Zimbabwe and clearing customs. We message you the moment it is ready to collect.',cta:null};
 if(/In transit to Zimbabwe|Handed to cargo company/i.test(o.status))return {tone:'ochre',ic:'plane',text:'On the water to Zimbabwe. Nothing more to pay.',cta:null};
 if(/consolidation|final weight|Ready for cargo|cargo batch|Cargo payment received/i.test(o.status))return {tone:'accent',ic:'box',text:'In the UK and being packed for the next shipment to Zimbabwe.',cta:null};
 if(t.initialPaid)return {tone:'accent',ic:'check',text:'Paid. We are working through the purchase and will keep this page updated.',cta:null};
 return {tone:'info',ic:'clock',text:'We are checking price, availability and UK delivery. Your quote is on its way.',cta:null};
}

const QUEUES=[
 ['New requests',[
   ['new','New requests',o=>/Request submitted|Product information captured|Awaiting price confirmation|Awaiting UK delivery confirmation/.test(o.status)],
   ['review','Needs manual review',o=>/Manual review required|Restricted-product review/.test(o.status)||o.items.some(i=>i.restricted.length&&!i.restrictedCleared)],
   ['newshop','New shop, set delivery',o=>!o.quote&&o.items.some(i=>!i.retailerId)],
   ['missing','Missing product detail',o=>o.items.some(i=>!i.name||i.confirmedPrice==null)&&!o.quote]
 ]],
 ['Quotes',[
   ['qready','Ready to send',o=>!!o.quote&&!o.quote.sentAt],
   ['qsent','Awaiting payment',o=>!!o.quote&&!!o.quote.sentAt&&!payTotals(o).initialPaid&&!quoteExpired(o)],
   ['qexpired','Expired',o=>quoteExpired(o)]
 ]],
 ['Purchasing',[
   ['tobuy','Paid, to purchase',o=>payTotals(o).initialPaid>0&&activeItems(o).some(i=>!i.purchase)&&!/cargo|transit|Zimbabwe|Delivered|collection/i.test(o.status)],
   ['decision','Customer decision needed',o=>/Additional payment required|Customer decision required|Substitute approval required|Product out of stock/.test(o.status)],
   ['dispatch','Awaiting UK dispatch',o=>activeItems(o).some(i=>i.purchase&&!i.received)]
 ]],
 ['UK receiving',[
   ['receiving','To check in',o=>activeItems(o).some(i=>i.purchase&&!i.received)],
   ['issues','Goods with issues',o=>o.items.some(i=>(i.issues||[]).length)]
 ]],
 ['Cargo',[
   ['weight','Awaiting weight',o=>activeItems(o).length>0&&activeItems(o).every(i=>i.received)&&!(o.cargo&&o.cargo.actualWeight)],
   ['cargopay','Shipping difference to settle',o=>{
     if(!(o.cargo&&o.cargo.actualWeight)||!o.quote)return false;
     const diff=round2(cargoCalc(o).total-quoteCalc(o).cargoEst);
     if(Math.abs(diff)<=S.settings.cargoTolerance)return false;
     if(diff>0)return !payTotals(o).cargoPaid;

   }],
   ['tobatch','Ready for a batch',o=>payTotals(o).initialPaid>0&&!!(o.cargo&&o.cargo.actualWeight)&&!o.batchId]
 ]],
 ['Everything',[
   ['all','All orders',()=>true],
   ['open','Open orders',o=>o.status!=='Delivered'&&o.status!=='Closed'],
   ['done','Completed',o=>o.status==='Delivered'||o.status==='Closed']
 ]]
];

function adminDash(){
 const orders=S.orders;
 const open=orders.filter(o=>o.status!=='Delivered'&&o.status!=='Closed');
 const revenue=orders.reduce((a,o)=>a+payTotals(o).net,0);
 const feeRev=orders.filter(o=>payTotals(o).initialPaid).reduce((a,o)=>a+quoteCalc(o).fee,0);
 const held=orders.flatMap(o=>o.payments).filter(p=>p.status==='Payment held');
 const acts=[
  ['review','Manual review','danger'],['qexpired','Expired quotes','warn'],['tobuy','Ready to purchase','accent'],
  ['receiving','To check in','info'],['weight','Awaiting weight','ochre'],['cargopay','Awaiting cargo payment','ochre']
 ].map(([k,l,t])=>({k,l,t,c:qCount(k)})).filter(x=>x.c>0);
 return `<div class="stack-l">
  <div class="spread wrap">
    <div class="stack-s"><div class="eyebrow">Operations</div><h2 style="font-size:24px">Today</h2></div>
    <div class="row"><a class="btn btn-s" href="#/request">${icon('plus',15)}Log a request</a></div>
  </div>
  <div class="kpis">
    <div class="kpi stripe-a"><span class="v num">${open.length}</span><span class="l">Open orders</span></div>
    <div class="kpi stripe-w"><span class="v num">${qCount('tobuy')}</span><span class="l">Paid, waiting to be bought</span></div>
    <div class="kpi stripe-o"><span class="v num">${qCount('cargopay')}</span><span class="l">Awaiting cargo payment</span></div>
    <div class="kpi"><span class="v num">${money(revenue)}</span><span class="l">Collected, net of refunds</span></div>
    <div class="kpi"><span class="v num">${money(feeRev)}</span><span class="l">Procurement fee revenue</span></div>
    <div class="kpi stripe-d"><span class="v num">${held.length}</span><span class="l">Payments on provider hold</span></div>
  </div>
  ${(()=>{const e=boxEconomics(S.orders.filter(o=>!/Delivered|Closed|refunded/i.test(o.status)&&(o.shipMode||'sea')==='sea'&&payTotals(o).initialPaid>0));
    if(!e.orders)return '';
    return `<div class="card"><div class="card-h"><b>Next sailing</b>${e.pays?pill('Pays for itself','accent'):pill('Short by '+money(-e.margin),'danger')}</div>
     <div class="card-b sum">
       <div class="l"><span>${e.orders} paid order${e.orders>1?'s':''} waiting</span><span class="v">${e.litres} L</span></div>
       <div class="l"><span>Cells booked of ${e.capacity}</span><span class="v">${e.cells}</span></div>
       <div class="l"><span>Filled</span><span class="v">${e.fillPct}%</span></div>
       <div class="l"><span>Shipping collected</span><span class="v">${money(e.revenue)}</span></div>
       <div class="l"><span>The shipper charges us</span><span class="v">-${money(e.cost)}</span></div>
       <div class="l total"><span>${e.margin>=0?'Margin on the freight':'Out of pocket'}</span><span class="v" style="color:${e.margin>=0?'var(--accent)':'var(--danger)'}">${money(e.margin)}</span></div>
     </div>
     ${e.pays
       ? note('This box covers its own cost. Anything else added before the '+S.settings.orderByDay+'th is margin.','accent','check')
       : note('<b>Sailing now loses '+money(-e.margin)+'.</b> A box costs the same whether it is full or not. Roughly '+e.needCells+' more small box'+(e.needCells>1?'es':'')+' would cover it, so either fill it before the '+S.settings.orderByDay+'th or hold these orders for the next sailing.','danger','alert')}
    </div>`})()}
  <div class="kpis" style="display:none">
  </div>

  ${acts.length?`<div class="card">
   <div class="card-h"><b>Needs a person</b><span class="eyebrow">Work queue</span></div>
   <div class="card-b row wrap" style="gap:8px">
     ${acts.map(a=>`<a class="btn btn-s" href="#/admin/orders?q=${a.k}"><span class="pill p-${a.t}">${a.c}</span>${esc(a.l)}</a>`).join('')}
   </div>
  </div>`:note('Nothing is waiting on you right now.','accent','check')}

  <div class="card">
   <div class="card-h"><b>Recent activity</b><a class="link tiny" href="#/admin/audit">Full audit log</a></div>
   <div class="scroll-x"><table class="t"><tbody>
     ${S.audit.slice(0,8).map(a=>`<tr><td class="mono tiny nowrap" style="color:var(--ink-3)">${fmtTime(a.at)}</td>
       <td>${a.ref?`<a class="link mono tiny" href="#/admin/order/${a.ref}">${a.ref}</a>`:'<span class="tiny muted">system</span>'}</td>
       <td class="small">${esc(a.action)}${a.after?` <span class="muted">${esc(a.before||'—')} → <b>${esc(a.after)}</b></span>`:''}</td></tr>`).join('')||'<tr><td class="empty">No activity yet.</td></tr>'}
   </tbody></table></div>
  </div>

  <div class="card">
   <div class="card-h"><b>Latest orders</b><a class="link tiny" href="#/admin/orders?q=all">See all</a></div>
   ${orderTable(orders.slice().sort((a,b)=>b.createdAt-a.createdAt).slice(0,6))}
  </div>
 </div>`;
}

function orderTable(list){
 if(!list.length)return `<div class="empty">Nothing in this queue.</div>`;
 return `<div class="scroll-x"><table class="t">
  <thead><tr><th>Ref</th><th>Customer</th><th>Items</th><th>Retailers</th><th>Value</th><th>Status</th><th>Age</th></tr></thead>
  <tbody>${list.map(o=>{
    const q=quoteCalc(o);
    const rets=[...new Set(o.items.map(i=>i.retailerName||'Unknown'))];
    return `<tr class="clickable" data-act="openOrder" data-ref="${o.ref}">
      <td class="mono nowrap"><b>${esc(o.ref)}</b></td>
      <td><div class="small"><b>${esc(o.customer.name||'—')}</b></div><div class="tiny muted">${esc(o.recipient.town||'')}</div></td>
      <td class="num">${o.items.length}</td>
      <td class="tiny">${rets.map(r=>esc(r)).join(', ')}</td>
      <td class="mono nowrap">${money(q.total)}</td>
      <td>${pill(o.status,statusTone(o.status))}</td>
      <td class="tiny muted nowrap">${ago(o.createdAt)}</td>
    </tr>`}).join('')}</tbody></table></div>`;
}

function adminOrders(qk){
 const def=QMAP[qk]||QMAP.all;
 let list=S.orders.filter(def.fn);
 const s=(VIEW.search||'').trim().toLowerCase();
 if(s)list=list.filter(o=>JSON.stringify([o.ref,o.customer,o.recipient,o.items.map(i=>[i.name,i.retailerName,i.purchase&&i.purchase.orderNumber]),o.payments.map(p=>p.ref),o.batchId]).toLowerCase().includes(s));
 list.sort((a,b)=>b.createdAt-a.createdAt);
 return `<div class="stack">
  <div class="spread wrap">
    <div class="stack-s"><div class="eyebrow">Queue</div><h2 style="font-size:22px">${esc(def.label)}</h2></div>
    <div class="row" style="max-width:340px;flex:1;min-width:220px">
      <input type="text" id="adminSearch" placeholder="Reference, name, phone, retailer order, payment ref" value="${esc(VIEW.search||'')}">
      <button class="btn btn-s" data-act="search">${icon('search',15)}</button>
    </div>
  </div>
  <div class="card">${orderTable(list)}</div>
  <div class="tiny muted">${list.length} order${list.length===1?'':'s'}. Search covers order reference, customer and recipient name, phone, email, retailer order number, payment reference and cargo batch.</div>
 </div>`;
}
/* ---------------- order detail ---------------- */
function adminOrder(ref){
 const o=getOrder(ref);
 if(!o)return `<div class="empty">Order ${esc(ref)} not found.</div>`;
 const q=quoteCalc(o), t=payTotals(o);
 const tabs=[
  ['review','Review',o.items.some(i=>i.restricted.length&&!i.restrictedCleared)||!o.quote],
  ['quote','Quote',!!o.quote&&!o.quote.sentAt],
  ['payments','Payments',t.initialPaid===0&&!!o.quote],
  ['purchase','Purchase',t.initialPaid>0&&activeItems(o).some(i=>!i.purchase)],
  ['receiving','UK receiving',activeItems(o).some(i=>i.purchase&&!i.received)],
  ['cargo','Cargo',activeItems(o).length>0&&activeItems(o).every(i=>i.received)&&!payTotals(o).cargoPaid],
  ['comms','Messages',false],
  ['history','History',false]
 ];
 const tab=VIEW.adminTab||'review';
 let pane='';
 if(tab==='review')pane=paneReview(o);
 else if(tab==='quote')pane=paneQuote(o,q);
 else if(tab==='payments')pane=panePayments(o,q,t);
 else if(tab==='purchase')pane=panePurchase(o);
 else if(tab==='receiving')pane=paneReceiving(o);
 else if(tab==='cargo')pane=paneCargo(o);
 else if(tab==='comms')pane=paneComms(o);
 else pane=paneHistory(o);
 return `<div class="stack">
  <div class="row" style="gap:8px"><a class="btn btn-xs btn-ghost" href="#/admin/orders?q=all"><span style="display:inline-block;transform:rotate(180deg)">${icon('arrow',13)}</span>All orders</a></div>
  <div class="spread wrap" style="align-items:flex-start">
   <div class="stack-s">
     <div class="row wrap" style="gap:8px"><span class="mono" style="font-size:23px;font-weight:700">${esc(o.ref)}</span>${pill(o.status,statusTone(o.status))}${o.partOfLargerOrder?pill('Consolidate','info'):''}</div>
     <div class="small muted">${esc(o.customer.name)} · ${esc(o.customer.email)} · ${esc(o.customer.whatsapp)} · submitted ${fmtFull(o.createdAt)}</div>
     <div class="small muted">Recipient ${esc(o.recipient.name)} · ${esc(o.recipient.phone)} · ${esc(o.recipient.town)}${o.recipient.collection?' · collects at '+esc(o.recipient.collection):''}</div>
   </div>
   <div class="col" style="align-items:flex-end;gap:6px">
     <div class="mono" style="font-size:20px;font-weight:700">${money(q.total)}</div>
     <div class="tiny muted">${t.initialPaid?'Paid '+money(t.initialPaid):'Not paid'}${t.cargoPaid?' · cargo '+money(t.cargoPaid):''}</div>
     ${o.quote&&!o.quote.sentAt&&!t.initialPaid?`<button class="btn btn-primary" data-act="approveQuote" data-ref="${o.ref}">${icon('check',16)}Approve and send ${money(q.total)}</button>`:''}
     <div class="row" style="gap:6px">
       <a class="btn btn-xs" href="#/track/${o.ref}/${o.token}" target="_blank">${icon('ext',13)}Customer view</a>
       <select data-act="forceStatus" data-ref="${o.ref}" style="width:auto;font-size:12px;padding:3px 6px">
         <option value="">Set status…</option>
         ${STATUS_GROUPS.map(g=>`<optgroup label="${esc(g[0])}">${g[1].map(s=>`<option ${o.status===s?'selected':''}>${esc(s)}</option>`).join('')}</optgroup>`).join('')}
       </select>
     </div>
   </div>
  </div>
  <div class="tabs">${tabs.map(([k,l,dot])=>`<button data-act="tab" data-v="${k}" class="${tab===k?'on':''}">${esc(l)}${dot?'<span class="dot"></span>':''}</button>`).join('')}</div>
  <div>${pane}</div>
 </div>`;
}

       <label class="f">Est. shipping weight (kg)<input type="number" step="0.05" data-item="${it.id}" data-k="estKg" value="${it.estKg}"></label>

  <div class="card card-p stack">

   </div>

 </div>`;
}
