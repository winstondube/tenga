/* ---- cargo ---- */
function paneCargo(o){
 const c=o.cargo||{}, calc=cargoCalc(o), t=payTotals(o), q=quoteCalc(o);
 const st=S.settings;
 const quoted=q.cargoEst;
 const diff=c.actualWeight?round2(calc.total-quoted):0;
 const allIn=activeItems(o).length>0&&activeItems(o).every(i=>i.received);
 return `<div class="stack" style="padding-top:16px">
  ${!allIn?note('Not everything has been checked in yet. You can still record a weight, but consolidation is incomplete.','warn','box'):''}
  ${c.actualWeight?`<div class="card"><div class="card-h"><b>Estimate against the scales</b>${Math.abs(diff)<=st.cargoTolerance?pill('Within tolerance','accent'):diff>0?pill('Customer owes '+money(diff),'danger'):pill('Refund '+money(-diff),'warn')}</div>
   <div class="card-b stack">
    <div class="sum">
      <div class="l"><span>Quoted and already paid</span><span class="v">${money(quoted)}</span></div>
      <div class="l"><span>Actual, from the scales</span><span class="v">${money(calc.total)}</span></div>
      <div class="l total"><span>Difference</span><span class="v" style="color:${Math.abs(diff)<=st.cargoTolerance?'var(--accent)':diff>0?'var(--danger)':'var(--warn)'}">${diff>0?'+':''}${money(diff)}</span></div>
    </div>
    ${Math.abs(diff)<=st.cargoTolerance
      ? note(`Rounding only, inside ${money(st.cargoTolerance)}. Nothing to settle.`,'accent','check')
      : diff>0
        ? `<div class="row wrap"><button class="btn btn-s" data-act="mkPayCustom" data-ref="${o.ref}">${icon('pound',15)}Request the ${money(diff)} difference</button><span class="tiny muted" style="padding-top:8px">Or absorb it and record why.</span></div>`
        : `<div class="row wrap"><button class="btn btn-s" data-act="cargoRefund" data-ref="${o.ref}" data-amt="${-diff}">${icon('refresh',15)}Refund ${money(-diff)} to the customer</button></div>`}
   </div></div>`:''}
  <div class="card">
   <div class="card-h"><b>Weight and cargo charges</b><span class="eyebrow">Quoted at ${money(quoted)} on ${q.cargoKg} kg</span></div>
   <div class="card-b stack">
    <div class="field-grid">
      <label class="f">Actual weight (kg)<input type="number" step="0.01" data-cargo="actualWeight" value="${c.actualWeight||''}"></label>
      <label class="f">Packaging (kg)<input type="number" step="0.01" data-cargo="packaging" value="${c.packaging!=null?c.packaging:S.settings.packagingKg}"></label>
      <label class="f">Length (cm)<input type="number" data-cargo="l" value="${c.l||''}"></label>
      <label class="f">Width (cm)<input type="number" data-cargo="w" value="${c.w||''}"></label>
      <label class="f">Height (cm)<input type="number" data-cargo="h" value="${c.h||''}"></label>
      <label class="f">Rate £ per ${o.shipMode==='air'?'kg':'litre'}<input type="number" step="0.01" data-cargo="rate" value="${c.rate!=null?c.rate:(o.shipMode==='air'?S.settings.airRate:seaRate())}"></label>
      <label class="f">Clearance £<input type="number" step="0.01" data-cargo="clearance" value="${c.clearance!=null?c.clearance:S.settings.clearance}"></label>
      <label class="f">Local delivery £<input type="number" step="0.01" data-cargo="localDelivery" value="${c.localDelivery!=null?c.localDelivery:S.settings.localDelivery}"></label>
      <label class="f">Other charges £<input type="number" step="0.01" data-cargo="other" value="${c.other||''}"></label>
    </div>
    <div class="sum">
      <div class="l"><span>Volumetric weight <span class="tiny muted">divisor ${S.settings.volDivisor}</span></span><span class="v">${calc.vol||0} kg</span></div>
      <div class="l"><span>Chargeable weight</span><span class="v">${calc.chargeable} kg</span></div>
      <div class="l"><span>Freight <span class="tiny muted">${esc(calc.basis)}, min ${money(o.shipMode==='air'?S.settings.airMin:S.settings.seaMin)}</span></span><span class="v">${money(calc.freight)}</span></div>
      <div class="l"><span>Clearance and local delivery</span><span class="v">${money(round2(calc.clearance+calc.local))}</span></div>
      ${calc.other?`<div class="l"><span>Other</span><span class="v">${money(calc.other)}</span></div>`:''}
      <div class="l total"><span>Zimbabwe shipping payable</span><span class="v">${money(calc.total)}</span></div>
    </div>
    <div class="row wrap">
      <button class="btn btn-s btn-primary" data-act="saveCargo" data-ref="${o.ref}">${icon('scale',15)}Save weight and charges</button>
      ${t.cargoPaid?pill('Top-up paid '+money(t.cargoPaid),'accent'):''}
    </div>
   </div>
  </div>

  <div class="card">
   <div class="card-h"><b>Shipment</b>${o.batchId?pill(o.batchId,'ochre'):pill('Not assigned','mute')}</div>
   <div class="card-b stack">
    <div class="field-grid">
      <label class="f">Cargo batch<select data-cargo2="batchId">
        <option value="">Not assigned</option>
        ${S.batches.map(b=>`<option value="${esc(b.id)}" ${o.batchId===b.id?'selected':''}>${esc(b.id)} · ${esc(b.company)} · ${fmtDate(b.shipDate)}</option>`).join('')}
      </select></label>
      <label class="f">Cargo company<input type="text" data-cargo="company" value="${esc(c.company||'')}"></label>
      <label class="f">Shipment reference<input type="text" data-cargo="shipRef" value="${esc(c.shipRef||'')}"></label>
      <label class="f">Cargo tracking<input type="text" data-cargo="tracking" value="${esc(c.tracking||'')}"></label>
      <label class="f">Expected arrival<input type="date" data-cargo="etaDate" value="${c.eta?new Date(c.eta).toISOString().slice(0,10):''}"></label>
      <label class="f">Collection or delivery<input type="text" data-cargo="dropoff" value="${esc(c.dropoff||o.recipient.collection||o.recipient.address||'')}"></label>
    </div>
    <div class="row wrap">
      <button class="btn btn-s btn-primary" data-act="saveCargo" data-ref="${o.ref}">${icon('check',15)}Save shipment details</button>
      <button class="btn btn-s" data-act="handOver" data-ref="${o.ref}" ${t.initialPaid?'':'disabled'}>${icon('truck',15)}Mark handed to cargo company</button>
    </div>
    ${!t.initialPaid?`<div class="tiny muted">The order must be paid before hand over.</div>`
      :Math.abs(diff)>st.cargoTolerance&&!t.cargoPaid&&diff>0?`<div class="tiny" style="color:var(--warn)">Shipping is ${money(diff)} over the quote. Settle that before shipping, or absorb it deliberately.</div>`:''}
   </div>
  </div>
 </div>`;
}

/* ---- reports ---- */
function adminReports(){
 const os=S.orders, n=os.length;
 const quoted=os.filter(o=>o.quote&&o.quote.sentAt).length;
 const paid=os.filter(o=>payTotals(o).initialPaid>0).length;
 const delivered=os.filter(o=>o.status==='Delivered');
 const avgVal=n?round2(os.reduce((a,o)=>a+quoteCalc(o).productTotal,0)/n):0;
 const avgFee=quoted?round2(os.filter(o=>o.quote&&o.quote.sentAt).reduce((a,o)=>a+quoteCalc(o).fee,0)/quoted):0;
 const avgDel=quoted?round2(os.filter(o=>o.quote&&o.quote.sentAt).reduce((a,o)=>a+quoteCalc(o).deliveryTotal,0)/quoted):0;
 const cargoOs=os.filter(o=>o.cargo&&o.cargo.actualWeight);
 const avgCargo=cargoOs.length?round2(cargoOs.reduce((a,o)=>a+cargoCalc(o).total,0)/cargoOs.length):0;
 const avgDays=delivered.length?round2(delivered.reduce((a,o)=>a+(o.timeline[o.timeline.length-1].at-o.createdAt)/86400e3,0)/delivered.length):0;
 const byRetailer={};os.forEach(o=>o.items.forEach(i=>{const k=i.retailerName||'Unknown';byRetailer[k]=(byRetailer[k]||0)+1}));
 const byTown={};os.forEach(o=>{const k=o.recipient.town||'Unknown';byTown[k]=(byTown[k]||0)+1});
 const byProduct={};os.forEach(o=>o.items.forEach(i=>{const k=(i.name||'').split(' ').slice(0,3).join(' ');if(k)byProduct[k]=(byProduct[k]||0)+i.qty}));
 const emails={};os.forEach(o=>{emails[o.customer.email]=(emails[o.customer.email]||0)+1});
 const repeat=Object.values(emails).filter(c=>c>1).length;
 const refunds=os.filter(o=>(o.refunds||[]).length).length;
 const oos=os.filter(o=>/out of stock|unavailable/i.test(o.status)).length;
 const restricted=os.filter(o=>o.items.some(i=>i.restricted.length)).length;
 const bar=(obj)=>{const e=Object.entries(obj).sort((a,b)=>b[1]-a[1]).slice(0,6);const max=Math.max(1,...e.map(x=>x[1]));
   return e.map(([k,v])=>`<div class="stack-s" style="gap:3px"><div class="spread small"><span>${esc(k)}</span><b class="mono">${v}</b></div>
   <div style="height:6px;background:var(--surface-2);border-radius:100px;overflow:hidden"><i style="display:block;height:100%;width:${v/max*100}%;background:var(--accent)"></i></div></div>`).join('')||'<div class="tiny muted">No data.</div>'};
 return `<div class="stack">
  <div class="stack-s"><div class="eyebrow">Reporting</div><h2 style="font-size:22px">How the business is running</h2></div>
  <div class="kpis">
    <div class="kpi"><span class="v num">${n}</span><span class="l">Requests submitted</span></div>
    <div class="kpi"><span class="v num">${n?Math.round(quoted/n*100):0}%</span><span class="l">Quote approval rate</span></div>
    <div class="kpi stripe-a"><span class="v num">${quoted?Math.round(paid/quoted*100):0}%</span><span class="l">Quote to payment conversion</span></div>
    <div class="kpi"><span class="v num">${money(avgVal)}</span><span class="l">Average product value</span></div>
    <div class="kpi"><span class="v num">${money(avgFee)}</span><span class="l">Average procurement fee</span></div>
    <div class="kpi"><span class="v num">${money(avgDel)}</span><span class="l">Average UK delivery</span></div>
    <div class="kpi stripe-o"><span class="v num">${money(avgCargo)}</span><span class="l">Average cargo charge</span></div>
    <div class="kpi"><span class="v num">${avgDays||'—'}</span><span class="l">Days, request to delivered</span></div>
    <div class="kpi"><span class="v num">${repeat}</span><span class="l">Repeat customers</span></div>
    <div class="kpi stripe-d"><span class="v num">${refunds}</span><span class="l">Orders with refunds</span></div>
    <div class="kpi stripe-w"><span class="v num">${oos}</span><span class="l">Out of stock events</span></div>
    <div class="kpi stripe-d"><span class="v num">${restricted}</span><span class="l">Restricted product flags</span></div>
  </div>
  <div class="field-grid two">
    <div class="card"><div class="card-h"><b>Orders by retailer</b></div><div class="card-b stack-s">${bar(byRetailer)}</div></div>
    <div class="card"><div class="card-h"><b>Orders by Zimbabwe destination</b></div><div class="card-b stack-s">${bar(byTown)}</div></div>
  </div>
  <div class="card"><div class="card-h"><b>Most requested products</b><span class="eyebrow">Candidates for local stock</span></div><div class="card-b stack-s">${bar(byProduct)}</div></div>
 </div>`;
}

 return `<div class="stack">

     <td>${a.ref?`<a class="link mono tiny" href="#/admin/order/${a.ref}">${a.ref}</a>`:'<span class="tiny muted">—</span>'}</td>

/* ================================================================
   EVENTS
   ================================================================ */
function curRef(){const p=route().parts;return (p[0]==='admin'&&p[1]==='order')?p[2]:null}
function curOrder(){const r=curRef();return r?getOrder(r):null}
function val(id){const el=document.getElementById(id);return el?el.value.trim():''}
function rerender(keep){VIEW.keepScroll=!!keep;render()}
const RECALC=new Set(['confirmedPrice','qty','displayedPrice','estKg','actualWeight','packaging','l','w','h','rate','clearance','localDelivery','other']);

/* --- generic binding --- */
document.addEventListener('input',e=>{
 const el=e.target; if(!el.dataset)return;
 const v=el.type==='checkbox'?el.checked:el.value;
 const d=el.dataset;
 // The hero reads the link as you type. extract() is offline and instant, so
 // this is a direct DOM write: a re-render here would steal the caret.
 if(el.id==='heroLink'){heroDetect(String(v));return}
 if(d.bind){const [a,b]=d.bind.split('.');const dr=draft();if(b)dr[a][b]=v;else dr[a]=v;save();return}
 const o=curOrder();
 if(d.item&&o){const it=o.items.find(i=>i.id===d.item);if(it){it[d.k]=(d.k==='qty'||d.k==='confirmedPrice'||d.k==='displayedPrice'||d.k==='estKg')?(v===''?(d.k==='confirmedPrice'?null:0):Number(v)):v;
   // A weight typed by hand has to beat the category guess, or the field is
   // decoration and we quote shipping off a number nobody agreed to. Clearing
   // it hands the item back to the automatic estimate.
   if(d.k==='estKg')it.estKgManual=v!=='';
   save()}return}
 if(d.attr&&o){const it=o.items.find(i=>i.id===d.attr);if(it){it.attrs=Object.assign({},it.attrs);if(v)it.attrs[d.k]=v;else delete it.attrs[d.k];save()}return}
 if(d.pur&&o){const it=o.items.find(i=>i.id===d.pur);if(it){it.purchase=it.purchase||{};it.purchase[d.k]=v;save()}return}
 if(d.rec&&o){const it=o.items.find(i=>i.id===d.rec);if(it){it.recDraft=it.recDraft||{};it.recDraft[d.k]=v;save()}return}
 if(d.cargo&&o){o.cargo=o.cargo||{};o.cargo[d.cargo]=(v===''?'':(['company','shipRef','tracking','etaDate','dropoff'].includes(d.cargo)?v:Number(v)));save();return}
 if(d.ret){const r=retailerById(d.ret);if(r){r[d.k]=(d.k==='delivery'||d.k==='freeOver')?Number(v||0):v;save()}return}
 if(d.set){S.settings[d.set]=(typeof DEFAULT_SETTINGS[d.set]==='number')?Number(v||0):v;save();return}
 if(d.batch&&d.k){const b=S.batches.find(x=>x.id===d.batch);if(b){b[d.k]=v;save()}return}
});
document.addEventListener('change',e=>{
 const el=e.target,d=el.dataset||{};
 if(d.act)return; // handled below
 if(RECALC.has(d.k)||RECALC.has(d.cargo)||d.item||d.cargo)rerender(true);
});

/* --- select-driven actions --- */
document.addEventListener('change',e=>{
 const el=e.target,d=el.dataset||{};const act=d.act;if(!act)return;
 const o=d.ref?getOrder(d.ref):curOrder();
 if(act==='forceStatus'&&el.value){setStatus(o,el.value,'Set manually by administrator');save();rerender(true)}
 else if(act==='cargoEst'){
   o.quote=o.quote||{deliveryOverrides:{},adjustments:[]};
   const before=quoteCalc(o).cargoEst;
   o.quote.cargoEstimate=el.value===''?null:round2(Number(el.value));
   logAudit(o.ref,'Shipping estimate overridden',money(before),money(quoteCalc(o).cargoEst));
   save();rerender(true);
 }

 else if(act==='setCat'){

 else if(act==='assignBatch'&&el.value){

/* --- clicks --- */
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]'); if(!el)return;
 const d=el.dataset, act=d.act;
 if(el.tagName==='SELECT')return;
 const o=d.ref?getOrder(d.ref):curOrder();
 const A={
  role(){ location.hash = d.v==='admin' ? '#/admin' : '#/'; },
  menu(){ S.menuOpen=!S.menuOpen; save(); rerender(true) },
  closeMenu(){ S.menuOpen=false; save(); },
  signin(){ S.signinOpen=true; S.menuOpen=false; save(); rerender(true) },
  closeSignin(){ if(el.classList.contains('modal-bg') && e.target.closest('.modal') && !e.target.closest('[data-act="closeSignin"][class*=btn]')) return;
    S.signinOpen=false; save(); rerender(true) },
  signinAs(){ S.session=d.v; S.signinOpen=false; save();
    logAudit('', d.v==='admin'?'Operations sign in':'Customer sign in','','demo session');
    location.hash = d.v==='admin' ? '#/admin' : '#/'; rerender(); },
  signout(){ S.session=null; save(); location.hash='#/'; rerender(); toast('Signed out') },
  reset(){ if(confirm('Clear all demo data and start again with the seeded example orders?')){localStorage.removeItem(KEY);fresh();location.hash='#/';render();toast('Demo reset')} },
  tab(){ VIEW.adminTab=d.v; rerender(true); },
  openOrder(){ VIEW.adminTab='review'; go('#/admin/order/'+d.ref); },
  search(){ VIEW.search=val('adminSearch'); rerender(true); },

  /* customer request */
  async fetch(){
    const url=val('linkInput'); const dr=draft(); dr.pendingUrl=url;
    if(!url){toast('Paste a product link first');return}
    const r=extract(url);
    if(!r.ok){dr.pending={reason:'badurl',msg:r.reason};save();rerender(true);return}
    // Measured against the live sites: Boots, Superdrug, ASOS and Beauty Bay
    // return nothing after a full timeout. Making everyone watch a spinner for
    // that is a cost with no matching benefit, so the card lands complete from
    // the link alone and the price field takes focus immediately.
    dr.pending={...r,live:'idle'};save();rerender(true);
    const f=document.getElementById('pPrice'); if(f&&!f.value)f.focus();
    if(r.reason==='noauto')return;
    // The few shops that do answer are still worth asking, but in the
    // background. If it lands the price appears; if not, nobody waited.
    const filled=await enrich(dr.pending);
    const typed=document.getElementById('pPrice');
    if(typed&&typed.value!=='')return;           // they got there first, leave the caret alone
    const d2=draft();
    if(d2.pending&&d2.pending.url===filled.url&&filled.live==='ok'&&filled.price!=null){
      d2.pending=filled;save();rerender(true);
      toast('Read '+money(filled.price)+' from '+filled.retailerName);
    }
  },
  pickShip(){ const dr=draft(); dr.shipMode=d.v==='air'?'air':'sea'; save(); rerender(true) },
  clearPending(){ const dr=draft();dr.pending=null;dr.pendingUrl='';save();rerender(true) },
  addItem(){ if(addPending()) goToStep('yourDetails') },
  addAnother(){ if(addPending()) goToStep('linkInput',true) },
  addManual(){
    const dr=draft(),p=dr.pending;
    const it=newItem({url:p.url,retailerId:null,retailerName:p.retailerName,name:'',availability:'Needs manual check',itemStatus:'Manual review required'});
    it.restricted=restrictedHits(p.url);
    dr.items.push(it);dr.pending=null;dr.pendingUrl='';save();rerender(true);toast('Submitted for manual review');
  },
  delDraft(){ const dr=draft();dr.items.splice(Number(d.ix),1);save();rerender(true) },
  heroGo(){
    const url=val('heroLink');
    const dr=draft();
    dr.pending=null;dr.pendingUrl=url;save();
    go('#/request');
    if(url)setTimeout(()=>{const i=document.getElementById('linkInput');if(i){i.value=url;A.fetch()}},30);
  },
  addMore(){
    const dr=draft();dr.pending=null;dr.pendingUrl='';save();rerender(true);
    const i=document.getElementById('linkInput');
    if(i){i.scrollIntoView({block:'center',behavior:'smooth'});i.focus()}
  },
  submitRequest(){
    const dr=draft();
    // The send button now floats, so it can be pressed from anywhere on the
    // page. Telling someone what is missing is no use if they cannot see it:
    // take them to the first empty field and put the cursor in it.
    const need=[
      ['customer.name','your name'],['customer.email','your email'],['customer.whatsapp','your WhatsApp number'],
      ['recipient.name','the recipient name'],['recipient.phone','the recipient phone']
    ].filter(([k])=>{const [a,b]=k.split('.');return !dr[a][b]});
    if(need.length){
      toast('Please add '+need.map(x=>x[1]).join(', '));
      const el=document.querySelector('[data-bind="'+need[0][0]+'"]');
      if(el){el.scrollIntoView({block:'center',behavior:'smooth'});el.focus();
        el.style.borderColor='var(--warn)';setTimeout(()=>{el.style.borderColor=''},2200);}
      return;
    }
    const o=newOrder({});
    Object.assign(o.customer,dr.customer);Object.assign(o.recipient,dr.recipient);
    o.items=dr.items;o.partOfLargerOrder=dr.partOfLargerOrder;o.customerNotes=dr.notes;o.shipMode=dr.shipMode||'sea';
    S.orders.push(o);
    setStatus(o,'Product information captured');
    const flagged=o.items.some(i=>i.restricted.length);
    
    if(flagged)setStatus(o,'Restricted-product review','Keywords: '+[...new Set(o.items.flatMap(i=>i.restricted))].join(', '));
    
    else setStatus(o,'Awaiting price confirmation');
    // Last, so its status is not overwritten by the checks above. Everything
    // the machine can work out is worked out, so what lands on the operations
    // desk is a finished price to check rather than a form to fill in. Nothing
    // reaches the customer until a person presses approve.
    autoQuote(o);
    logAudit(o.ref,'Request submitted','',o.items.length+' items','');
    logMsg(o.ref,'Request received','Email',o.customer.email,'We have received your request. We are checking the current product price, availability and UK delivery cost. You will receive a final quote before payment.');
    S.draft=null;save();go('#/submitted/'+o.ref);
  },
  lookup(){
    const r=val('lookupRef').toUpperCase();
    const o=S.orders.find(x=>x.ref.toUpperCase()===r);
    const box=document.getElementById('lookupMsg');
    if(o)go('#/track/'+o.ref+'/'+o.token);

  },

  /* customer payment */
  pay(){
    const boxes=[...document.querySelectorAll('.qc')];
    if(boxes.some(b=>!b.checked)){toast('Please tick all the confirmations first');return}
    // Two quotes were offered, so the route is only decided here, by the customer.

  payNow(){

    if(!p)return;
    p.provider=d.provider;p.status=(d.provider==='PayPal'&&kind==='initial')?'Payment held':'Payment completed';

  /* admin: review */
  approveItem(){ const it=o.items.find(i=>i.id===d.id);

  clearRestricted(){ const it=o.items.find(i=>i.id===d.id);const why=prompt('Why is this acceptable? Recorded in the audit log.','Not pressurised, cargo company confirmed acceptable');

  },
  addAdj(){ const amt=Number(val('adjAmt'));const why=val('adjReason');

  delAdj(){ const before=quoteCalc(o).total;const a=o.quote.adjustments.splice(Number(d.i),1)[0];

  approveQuote(){
    const q=quoteCalc(o);

  /* admin: receiving */
  receive(){
    const it=o.items.find(i=>i.id===d.id);const rd=it.recDraft||{};
    it.received={at:Date.now(),qtyReceived:Number(rd.qtyReceived||it.qty),condition:rd.condition||'Good',
      variantOk:(rd.variantOk||'Yes')==='Yes',photos:String(rd.photos||'').split(',').map(s=>s.trim()).filter(Boolean),notes:rd.notes||'',by:'Admin (demo)'};
    it.itemStatus='Received';delete it.recDraft;
    logAudit(o.ref,'Goods checked in',it.name,it.received.condition,'Qty '+it.received.qtyReceived);
    if(activeItems(o).every(i=>i.received)){setStatus(o,'Received and checked');setStatus(o,'Awaiting final weight');
      logMsg(o.ref,'Goods received in the UK','Email',o.customer.email,'Everything has arrived at our UK address and passed inspection. Next we weigh the parcel and confirm the Zimbabwe shipping charge.');}
    else setStatus(o,'Partially received');
    save();rerender(true);toast('Checked in')
  },

  /* admin: cargo */
  saveCargo(){
    o.cargo=o.cargo||{};
    if(o.cargo.etaDate)o.cargo.eta=new Date(o.cargo.etaDate).getTime();
    const sel=document.querySelector('[data-cargo2="batchId"]');
    if(sel){const bid=sel.value||null;
      if(bid!==o.batchId){
        S.batches.forEach(b=>{b.orders=b.orders.filter(r=>r!==o.ref)});
        if(bid){const b=S.batches.find(x=>x.id===bid);b.orders.push(o.ref);o.cargo.company=o.cargo.company||b.company;setStatus(o,'Assigned to cargo batch',bid)}
        o.batchId=bid;logAudit(o.ref,'Cargo batch changed','',bid||'none');
      }}
    const c=cargoCalc(o);
    logAudit(o.ref,'Cargo details saved','',c.chargeable+' kg, '+money(c.total));
    if(o.cargo.actualWeight&&!payTotals(o).cargoPaid)setStatus(o,'Awaiting final weight');
    save();rerender(true);toast('Cargo details saved')
  },
  handOver(){
    setStatus(o,'Packed for Zimbabwe');setStatus(o,'Handed to cargo company');
    logAudit(o.ref,'Handed to cargo company','',o.cargo.company||'cargo partner');
    logMsg(o.ref,'Handed to cargo company','WhatsApp',o.customer.whatsapp,'Your parcel has been handed to '+(o.cargo.company||'the cargo company')+'. Reference '+(o.cargo.shipRef||'to follow')+'.');
    save();rerender(true);toast('Handed over')
  },

  /* admin: comms */
  sendMsg(){
    const t=val('tplSel'),ch=val('tplChan');
    const to=ch==='Email'?o.customer.email:o.customer.whatsapp;
    logMsg(o.ref,t,ch,to,TEMPLATE_BODY(t,o));
    logAudit(o.ref,'Message sent','',t+' via '+ch);
    save();rerender(true);toast(t+' sent via '+ch)
  },

  /* config */
  addRetailer(){
    const name=prompt('Retailer name');if(!name)return;
    const dom=prompt('Domain, for example example.co.uk');if(!dom)return;
    S.retailers.push({id:uid('r'),name,domains:[dom.replace(/^https?:\/\//,'').replace(/^www\./,'').split('/')[0]],status:'manual',delivery:3.99,freeOver:0,autoExtract:false,notes:'New retailer, manual review until trusted.'});
    logAudit('','Retailer added','',name);save();rerender(true)
  },
  addKw(){ const k=val('kwNew').toLowerCase();if(!k)return;if(!S.restricted.includes(k))S.restricted.push(k);logAudit('','Restricted keyword added','',k);save();rerender(true) },
  delKw(){ const k=S.restricted.splice(Number(d.i),1)[0];logAudit('','Restricted keyword removed',k,'');save();rerender(true) },
  saveSettings(){ logAudit('','Business rules updated','',JSON.stringify(S.settings).slice(0,90)+'…');save();rerender(true);toast('Settings saved') },
  addBatch(){
    const company=prompt('Cargo company','Swift Cargo Zimbabwe');if(!company)return;
    const id='BATCH-'+String(S.batches.length+1).padStart(4,'0');
    S.batches.push({id,company,shipDate:Date.now(),eta:Date.now()+10*86400e3,ref:'',manifest:'',status:'Packed for Zimbabwe',orders:[]});
    logAudit('','Cargo batch created','',id);save();rerender(true)
  },
  saveBatch(){ const b=S.batches.find(x=>x.id===d.batch);
    if(b.shipDate&&typeof b.shipDate==='string')b.shipDate=new Date(b.shipDate).getTime();
    if(b.eta&&typeof b.eta==='string')b.eta=new Date(b.eta).getTime();
    logAudit('','Cargo batch saved','',b.id);save();rerender(true);toast('Batch saved') },
  pushBatchStatus(){ const b=S.batches.find(x=>x.id===d.batch);
    b.orders.forEach(r=>{const ord=getOrder(r);if(ord){setStatus(ord,b.status,'Batch '+b.id);
      logMsg(r,b.status,'WhatsApp',ord.customer.whatsapp,'Update on '+r+': '+b.status+'.')}});
    logAudit('','Batch status applied','',b.status+' to '+b.orders.length+' orders');save();rerender(true);toast('Applied to '+b.orders.length+' orders') }
 };
 if(A[act]){e.preventDefault();A[act]()}
});

function TEMPLATE_BODY(t,o){
 const q=o.quote?quoteCalc(o):null, c=o.cargo&&o.cargo.actualWeight?cargoCalc(o):null;
 const M={
  'Request received':'We have received your request. We are checking the current product price, availability and UK delivery cost. You will receive a final quote before payment.',
  'Quote ready':'Your quote for '+o.ref+' is '+(q?money(q.total):'')+'. It expires in '+(o.quote&&o.quote.expiryMins||60)+' minutes.',
  'Quote expiring':'Your quote for '+o.ref+' expires shortly. Prices move, so we will need to recheck if it lapses.',
  'Payment received':'We have received your payment for '+o.ref+'. We will now place the retailer order. Zimbabwe shipping is charged separately.',
  'Cargo payment required':'Your parcel has been weighed'+(c?' at '+c.chargeable+' kg':'')+'. Zimbabwe shipping is '+(c?money(c.total):'')+'.',
  'Ready for collection':'Your parcel has arrived and is ready for collection'+(o.recipient.collection?' at '+o.recipient.collection:'')+'. Bring ID.',
  'Delivered':'Your order '+o.ref+' has been delivered. Thank you for using Tenga.'
 };
 return M[t]||(t+' update for order '+o.ref+'.');
}

function applyPaymentEffects(o,p){
 if(!/completed|available|held/i.test(p.status))return;
 if(p.type==='initial'){
   setStatus(o,p.status==='Payment held'?'Initial payment held':'Initial payment completed');
   setStatus(o,'Paid — awaiting retailer purchase');
   if(o.quote)o.quote.status='Accepted';
   logMsg(o.ref,'Payment received','Email',o.customer.email,'We have received '+money(p.amount)+' for '+o.ref+'. The retailer purchase will now be placed. Zimbabwe shipping will be charged separately once the parcel is weighed.');
 } else if(p.type==='cargo'){
   setStatus(o,'Cargo payment received');setStatus(o,'Ready for cargo');
   logMsg(o.ref,'Cargo payment received','Email',o.customer.email,'Thank you, your Zimbabwe shipping payment of '+money(p.amount)+' has been received. Your parcel will go on the next shipment.');
 } else {
   setStatus(o,'Purchase in progress','Additional payment received');
 }
}

/* ================================================================
   BOOT
   ================================================================ */
if(!load())fresh();
if(!S.batches)S.batches=[];
render();
</script>
