name = "tenga-api"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Free tier: 100k requests a day, and D1 gives 5GB of storage. At Tenga's
# volumes this costs nothing, and the site itself stays on GitHub Pages.
[[d1_databases]]
binding = "DB"
database_name = "tenga"
database_id = "e946c9a5-84db-4942-9de8-351710fc23ab"

[vars]
# Both, so the switch to the real domain does not need an API deploy.
SITE_ORIGINS = "https://tengauk.com,https://www.tengauk.com,https://winstondube.github.io"
MAIL_FROM = "Tenga UK <help@tengauk.com>"
PAYPAL_ENV = "sandbox"

# Secrets are set with `wrangler secret put NAME`, never committed:
#   PAYPAL_CLIENT_ID, PAYPAL_SECRET, PAYPAL_WEBHOOK_ID, RESEND_KEY
